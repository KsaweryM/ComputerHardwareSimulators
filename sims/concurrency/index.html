<!DOCTYPE html>
<html lang="pl">
<head>
<script>(function(){try{if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embed');}catch(e){}})();</script>
<style>html.embed .wrap{max-width:none;padding:14px 18px 48px}html.embed header.topbar,html.embed .side,html.embed .modhead{display:none}html.embed .layout{grid-template-columns:minmax(0,1fr);margin-top:0}</style>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Symulator współbieżności: przerwania, planista, wątki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunken:#EAEEF2; --ink:#16202B; --muted:#5B6673; --rule:#D5DBE1; --focus:#2F6FDB;
  --ok:#1E7E4F; --ok-bg:#E2F3EA; --bad:#B8372B; --bad-bg:#FBE7E4;
  --work:#23914F; --work-bg:#DFF2E6; --poll:#C8453A; --poll-bg:#FBE4E1; --isr:#D9621C; --isr-bg:#FCE8DA;
  --idle:#BCC4CC; --idle-bg:#EEF1F4;
  --ta:#1E78C8; --tb:#7C3AB4; --tc:#23914F; --th:#D23F4A; --sched:#D9621C; --shared:#B07A12;
  --run:#23914F; --run-bg:#DFF2E6; --ready:#1E78C8; --ready-bg:#DDEAF8; --blk:#7D8792; --blk-bg:#E6E9ED;
  --rd:#1E96E6; --wr:#DC3250;
  --led1:#E5484D; --led2:#E2A60E; --led3:#2FA84F; --led-off:#CFD5DB;
  --lcd-bg:#A6CC4A; --lcd-ink:#1D3409; --lcd-frame:#2A3440;
  --on-color:#FFFFFF;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
    --ok:#5FD19A; --ok-bg:#15352A; --bad:#F08A7E; --bad-bg:#3E1C19;
    --work:#4CC283; --work-bg:#163427; --poll:#EE7F72; --poll-bg:#3E1C19; --isr:#F29A5C; --isr-bg:#3D2414;
    --idle:#4A5663; --idle-bg:#222C37;
    --ta:#5AA7EE; --tb:#B98BEA; --tc:#4CC283; --th:#F07C84; --sched:#F29A5C; --shared:#E0B44E;
    --run:#4CC283; --run-bg:#163427; --ready:#5AA7EE; --ready-bg:#14293D; --blk:#8994A0; --blk-bg:#262F3A;
    --rd:#5AB8F5; --wr:#F27390;
    --led1:#FF6B6F; --led2:#F5C044; --led3:#4CC877; --led-off:#3A4552;
    --lcd-bg:#7FA52E; --lcd-ink:#10200A; --lcd-frame:#0A0E12; --on-color:#0F1419;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
  --ok:#5FD19A; --ok-bg:#15352A; --bad:#F08A7E; --bad-bg:#3E1C19;
  --work:#4CC283; --work-bg:#163427; --poll:#EE7F72; --poll-bg:#3E1C19; --isr:#F29A5C; --isr-bg:#3D2414;
  --idle:#4A5663; --idle-bg:#222C37;
  --ta:#5AA7EE; --tb:#B98BEA; --tc:#4CC283; --th:#F07C84; --sched:#F29A5C; --shared:#E0B44E;
  --run:#4CC283; --run-bg:#163427; --ready:#5AA7EE; --ready-bg:#14293D; --blk:#8994A0; --blk-bg:#262F3A;
  --rd:#5AB8F5; --wr:#F27390;
  --led1:#FF6B6F; --led2:#F5C044; --led3:#4CC877; --led-off:#3A4552;
  --lcd-bg:#7FA52E; --lcd-ink:#10200A; --lcd-frame:#0A0E12; --on-color:#0F1419;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 60px}
@media (max-width:620px){.wrap{padding:20px 16px 48px}}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
header h1{font-size:26px;font-weight:600;margin:0 0 4px;letter-spacing:-0.01em}
header p{margin:0;color:var(--muted);max-width:78ch}
.langs{display:flex;gap:6px}
.langs button{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:13px}
.langs button svg{width:22px;height:14px;border-radius:2px;box-shadow:0 0 0 1px var(--rule);display:block}
.langs button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken)}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;min-width:0}
h2{font-size:16px;font-weight:600;margin:0 0 10px}
h3{font-size:14px;font-weight:600;margin:0 0 6px}
label{font-size:13px;color:var(--muted)}
select,input[type=text]{font:inherit;font-family:var(--mono);font-size:14px;color:var(--ink);background:var(--sunken);border:1px solid var(--rule);border-radius:6px;padding:6px 9px}
input[type=range]{accent-color:var(--ink);width:180px}
button{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{background:var(--sunken)}
button:disabled{opacity:.45;cursor:default}
button:disabled:hover{background:var(--surface)}
button.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button.primary:hover{opacity:.9;background:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.mono{font-family:var(--mono)}

/* an interrupt: the three stages */
.phases{display:flex;flex-direction:column;gap:6px}
.ph{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:8px;background:var(--sunken);opacity:.5;font-size:14px;transition:opacity .15s}
.ph .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--isr);color:var(--on-color);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center}
.ph.main .n{background:var(--work)}
.ph.on{opacity:1;background:var(--isr-bg);box-shadow:inset 0 0 0 2px var(--isr)}
.ph.main.on{background:var(--work-bg);box-shadow:inset 0 0 0 2px var(--work)}

/* sidebar layout */
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;margin-top:22px;align-items:start}
.layout>.stack{margin-top:0}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:12px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:900px){.side{position:static;max-height:none}}
.grp .gh{width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px}
.grp .gh:hover{background:var(--sunken)}
.grp .gh b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.grp .gh small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.grp .gnum{flex:none;width:30px;height:30px;border-radius:8px;background:var(--sunken);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:15px}
.grp .chev{width:14px;height:14px;margin-left:auto;color:var(--muted);transition:transform .15s}
.grp.open .gh{background:var(--sunken)}
.grp.open .gnum{background:var(--ink);color:var(--surface)}
.grp.open .chev{transform:rotate(90deg)}
.grp .items{display:none;flex-direction:column;gap:2px;margin:4px 0 8px 24px;padding-left:10px;border-left:2px solid var(--rule)}
.grp.open .items{display:flex}
.items button{border:0;background:none;text-align:left;padding:6px 10px;border-radius:6px;font-weight:500;line-height:1.3}
.items button small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}
.items button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.items button[aria-pressed="true"] small{color:var(--surface);opacity:.75}
.modhead{padding:2px 2px 0}
.modhead span{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.modhead h2{font-size:22px;margin:2px 0 2px}
.modhead p{margin:0;color:var(--muted);font-size:14px}

/* control bar */
.ctrlbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 16px}
.ctrlbar button{display:inline-flex;align-items:center;gap:8px}
.ctrlbar svg{width:14px;height:14px}
.cyc{font-family:var(--mono);font-size:18px;font-weight:500}
.opts{display:flex;gap:14px 22px;flex-wrap:wrap;align-items:flex-end}
.opt{display:flex;flex-direction:column;gap:4px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 11px;font-size:13px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--ink);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--ink)}

/* explanation box */
.expl{display:flex;gap:12px;align-items:flex-start;background:var(--sunken);border-radius:8px;padding:12px 14px;border-left:4px solid var(--ink)}
.expl .bn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--isr);color:var(--on-color);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center}
.expl .bn:empty{display:none}
.expl b.t{display:block;font-size:15px}
.expl p{margin:2px 0 0;font-size:14.5px}
.expl code,.note code,.tbl code,.key code{font-family:var(--mono);font-size:.92em}
.expl .q{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule);color:var(--muted);font-size:14px}
.expl .q b{color:var(--ink)}
.expl.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.expl.good{border-left-color:var(--ok);background:var(--ok-bg)}
.key{margin-top:10px;font-size:13.5px;padding:8px 12px;border:1px dashed var(--rule);border-radius:8px}

.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.grid2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid2,.grid2e,.grid3{grid-template-columns:minmax(0,1fr)}}
.scroll{overflow-x:auto}
svg text{font-family:var(--sans)}
svg .m{font-family:var(--mono)}

.code{margin:0;font-family:var(--mono);font-size:13px;line-height:1.6;background:var(--sunken);border-radius:8px;padding:10px 0;overflow-x:auto;white-space:pre}
.code .l{display:block;padding:0 14px;border-left:3px solid transparent}
.code .l.act{background:color-mix(in srgb,var(--isr) 16%,transparent);border-left-color:var(--isr)}
.code .l.act.w{background:color-mix(in srgb,var(--work) 16%,transparent);border-left-color:var(--work)}
.code .l.act.p{background:color-mix(in srgb,var(--poll) 16%,transparent);border-left-color:var(--poll)}
.code .l.act.k{background:var(--ink);color:var(--surface);border-left-color:var(--ink)}
.code .l.act.k .c{color:var(--surface);opacity:.8}
.code .l.seen{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.code .l.dim{opacity:.45}
.code .c{color:var(--muted)}
.code .pcm{display:inline-block;width:1.4em;color:var(--isr);font-weight:600}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--sunken);border-radius:8px;padding:7px 10px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-family:var(--mono);font-size:18px;font-weight:500}
.stat.good b{color:var(--ok)} .stat.bad b{color:var(--bad)}

.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;margin-top:8px;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td.mono{font-family:var(--mono)}

/* status pills */
.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.act{background:var(--isr-bg);color:var(--isr)}
.pill.run{background:var(--run-bg);color:var(--run)} .pill.ready{background:var(--ready-bg);color:var(--ready)} .pill.blk{background:var(--blk-bg);color:var(--blk)}

/* registers */
.regs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.reg{background:var(--sunken);border-radius:7px;padding:6px 10px;border:2px solid transparent}
.reg span{display:block;font-size:12px;color:var(--muted)}
.reg b{font-family:var(--mono);font-size:15px;font-weight:500}
.reg.chg{border-color:var(--wr);background:color-mix(in srgb,var(--wr) 10%,var(--sunken))}
.reg.rd{border-color:var(--rd);background:color-mix(in srgb,var(--rd) 10%,var(--sunken))}
.reg.sel{border-color:var(--sched);background:color-mix(in srgb,var(--sched) 12%,var(--sunken))}
.reg.dim{opacity:.5}

/* LCD and big button */
.lcd{display:inline-block;background:var(--lcd-frame);padding:9px;border-radius:8px}
.lcd pre{margin:0;background:var(--lcd-bg);color:var(--lcd-ink);font-family:var(--mono);font-weight:600;font-size:16px;line-height:1.35;padding:6px 10px;border-radius:3px;letter-spacing:.06em}
.bigbtn{display:inline-flex;flex-direction:column;align-items:center;gap:6px;user-select:none;-webkit-user-select:none;touch-action:none}
.bigbtn button{width:92px;height:92px;border-radius:50%;border:8px solid var(--lcd-frame);background:var(--work);color:var(--on-color);font-weight:600;font-size:15px;box-shadow:0 5px 0 color-mix(in srgb,var(--work) 55%,#000);transition:transform .05s,box-shadow .05s}
.bigbtn button:hover{background:var(--work);filter:brightness(1.05)}
.bigbtn button.down{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--work) 55%,#000)}
.bigbtn.sm button{width:64px;height:64px;border-width:6px;font-size:13px}

/* trace strip */
.strip{display:flex;gap:3px;flex-wrap:wrap}
.strip span{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:4px;color:var(--on-color)}
.strip .m{background:var(--work)} .strip .t{background:transparent;color:var(--isr);border:1.5px dashed var(--isr);padding:1px 5px}
.strip .i{background:var(--isr)}

/* LEDs */
.leds{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
.led{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;min-width:92px}
.led i{display:block;width:38px;height:38px;border-radius:50%;background:var(--led-off);border:3px solid color-mix(in srgb,var(--ink) 18%,transparent);transition:background .12s}
.led.on i{background:var(--c);box-shadow:0 0 16px 3px color-mix(in srgb,var(--c) 60%,transparent)}
.led.chg i{outline:3px solid var(--isr);outline-offset:3px}
.led small{color:var(--muted);font-size:12px;text-align:center}
.bignum{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.1}

/* stacks and memory cells */
.mem{display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:13px}
.cell{display:grid;grid-template-columns:76px minmax(0,1fr) 54px;align-items:center;gap:6px}
.cell .ad{color:var(--muted);font-size:12px}
.cell .v{padding:5px 9px;border-radius:5px;background:var(--sunken);border:2px solid transparent;min-height:31px}
.cell .v.a{background:color-mix(in srgb,var(--ta) 16%,var(--sunken))}
.cell .v.b{background:color-mix(in srgb,var(--tb) 16%,var(--sunken))}
.cell .v.empty{background:transparent;border:1.5px dashed var(--rule)}
.cell .v.old{opacity:.5}
.cell .v.chg{border-color:var(--wr)} .cell .v.rd{border-color:var(--rd)}
.cell .tp{font-family:var(--sans);font-size:12px;font-weight:600;white-space:nowrap}

/* threads (race, mutex, deadlock) */
.threads{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.threads{grid-template-columns:minmax(0,1fr)}}
.thr{border:2px solid var(--c);border-radius:10px;padding:12px 14px;background:color-mix(in srgb,var(--c) 6%,var(--surface));transition:opacity .2s,filter .2s}
.thr.blocked{filter:grayscale(1);opacity:.6;border-style:dashed}
.thr .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.thr .hd b{font-size:16px;color:var(--c)}
.thr button.go{width:100%;margin-top:10px;background:var(--c);color:var(--on-color);border-color:var(--c);font-weight:600}
.thr button.go:hover{filter:brightness(1.07);background:var(--c)}
.thr button.go:disabled{filter:grayscale(1)}
.mid{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.memcell{border:2px solid var(--shared);border-radius:10px;padding:10px 12px;text-align:center;background:color-mix(in srgb,var(--shared) 7%,var(--surface))}
.memcell span{display:block;font-size:12.5px;color:var(--muted)}
.memcell b{font-family:var(--mono);font-size:30px;font-weight:600}
.memcell.flash-w{border-color:var(--wr)} .memcell.flash-r{border-color:var(--rd)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 7px;border-radius:4px;color:var(--on-color);background:var(--c)}
.chip.x{background:transparent;color:var(--c);border:1.5px dashed var(--c);padding:1px 6px}
.tried{display:flex;flex-direction:column;gap:4px;margin-top:8px;max-height:260px;overflow:auto}
.tried div{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:12.5px;padding:3px 8px;border-radius:5px;background:var(--sunken)}
.tried div b{margin-left:auto}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)}
.banner{border-radius:8px;padding:10px 14px;font-weight:600;text-align:center}
.banner.bad{background:var(--bad);color:var(--on-color)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.info{background:var(--sunken);color:var(--muted);font-weight:500}

/* producer-consumer */
.pcrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:900px){.pcrow{grid-template-columns:minmax(0,1fr)}}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot{width:42px;height:42px;border-radius:7px;border:2px dashed var(--rule);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600}
.slot.full{border:2px solid var(--shared);background:color-mix(in srgb,var(--shared) 22%,var(--surface))}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--sunken)}
.bar i{display:block;height:100%}
.ctl{display:flex;flex-direction:column;gap:4px;min-width:200px}
.ctl output{font-family:var(--mono);font-size:13px;color:var(--ink)}

@media (prefers-reduced-motion:no-preference){

    <button data-lang="en" aria-pressed="false"><svg viewBox="0 0 60 30" aria-hidden="true"><clipPath id="ukS"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="ukT"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#ukS)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukT)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>EN</button>
  </div>
</header>

<div class="layout">
<aside class="side" id="topics" aria-label="Topics">
  <div class="grp" data-grp="g6">
    <button class="gh" data-grp="g6" aria-expanded="false"><span class="gnum">6</span><span><small data-i="lect6"></small><b data-i="g6n"></b></span><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="items">
      <button data-mod="intr"><span data-i="tp_intr"></span><small data-i="tp_intr_s"></small></button>
      <button data-mod="irq"><span data-i="tp_irq"></span><small data-i="tp_irq_s"></small></button>
      <button data-mod="tick"><span data-i="tp_tick"></span><small data-i="tp_tick_s"></small></button>
      <button data-mod="slice"><span data-i="tp_slice"></span><small data-i="tp_slice_s"></small></button>
    </div>
  </div>
  <div class="grp" data-grp="g7">
    <button class="gh" data-grp="g7" aria-expanded="false"><span class="gnum">7</span><span><small data-i="lect7"></small><b data-i="g7n"></b></span><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="items">
      <button data-mod="race"><span data-i="tp_race"></span><small data-i="tp_race_s"></small></button>
      <button data-mod="mutex"><span data-i="tp_mutex"></span><small data-i="tp_mutex_s"></small></button>
    </div>
  </div>
  <div class="grp" data-grp="g8">
    <button class="gh" data-grp="g8" aria-expanded="false"><span class="gnum">8</span><span><small data-i="lect8"></small><b data-i="g8n"></b></span><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="items">
      <button data-mod="dead"><span data-i="tp_dead"></span><small data-i="tp_dead_s"></small></button>
      <button data-mod="pc"><span data-i="tp_pc"></span><small data-i="tp_pc_s"></small></button>
    </div>
  </div>
</aside>
<div class="stack main">
  <div class="modhead"><span id="mhGrp"></span><h2 id="mhTitle"></h2><p id="mhSub"></p></div>

  <!-- ================= AN INTERRUPT ================= -->
  <div class="stack mod" id="mod-intr" hidden style="margin-top:0">
    <section class="panel">
      <h2 data-i="in_h_setup"></h2>
      <div class="opts">
        <div class="opt"><label data-i="in_l_slow"></label><label class="chk"><input type="checkbox" id="inSlow" checked><span data-i="in_slow"></span></label></div>
      </div>
      <div class="grid2e" style="margin-top:14px">
        <div><h3 data-i="in_main"></h3><pre class="code" id="inMain"></pre></div>
        <div><h3 data-i="in_isr"></h3><pre class="code" id="inIsr"></pre></div>
      </div>
    </section>
    <div class="ctrlbar" data-ctrl="intr"></div>
    <section class="panel">
      <div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">
        <div class="bigbtn"><button id="inBtn" aria-label="A">A</button><span class="note" style="margin:0" data-i="in_hold"></span></div>
        <div class="lcd"><pre id="inLcd"></pre></div>
        <div style="flex:1;min-width:260px"><div class="phases" id="inPhase"></div></div>
      </div>
      <div class="expl" id="inExpl" style="margin-top:14px"></div>
    </section>
    <section class="panel">
      <h2 data-i="in_h_time"></h2>
      <div class="scroll"><svg id="inSvg" viewBox="0 0 1000 210" style="width:100%;min-width:640px;display:block" role="img"></svg></div>
      <div class="legend" id="inLegend"></div>
      <div class="stats" id="inStats" style="margin-top:12px"></div>
    </section>
  </div>

  <!-- ================= POLLING vs INTERRUPT ================= -->
  <div class="stack mod" id="mod-irq" hidden style="margin-top:0">
    <section class="panel">
      <h2 data-i="ir_h_setup"></h2>
      <div class="opts">
        <div class="opt"><label for="irAt" data-i="ir_l_at"></label><select id="irAt"></select></div>
      </div>
      <p class="note" data-i="ir_setup_note"></p>
    </section>
    <div class="ctrlbar" data-ctrl="irq"></div>
    <section class="panel">
      <div class="expl" id="irExpl"></div>
      <div class="grid2e" style="margin-top:14px">
        <div><h3 data-i="ir_main"></h3><pre class="code" id="irMain"></pre></div>
        <div><h3 data-i="ir_isr"></h3><pre class="code" id="irIsr"></pre></div>
      </div>
    </section>
    <div class="grid2">
      <section class="panel">
        <h2 data-i="ir_h_regs"></h2>
        <div class="regs" id="irRegs"></div>
        <h3 style="margin-top:12px" data-i="ir_h_mem"></h3>
        <div class="regs" id="irMem"></div>
        <p class="note" data-i="ir_regs_note"></p>
      </section>
      <section class="panel">
        <h2 data-i="ir_h_trace"></h2>
        <div class="strip" id="irStrip"></div>
        <div class="legend" id="irLegend"></div>
      </section>
    </div>
  </div>

  <!-- ================= TIMER AND TICK ================= -->
  <div class="stack mod" id="mod-tick" hidden style="margin-top:0">
    <section class="panel">
      <h2 data-i="tk_h_setup"></h2>
      <div class="opts">
        <div class="opt"><label data-i="tk_l_how"></label><div class="seg" id="tkHow"><button data-v="timer" data-i="tk_m_timer"></button><button data-v="millis" data-i="tk_m_millis"></button></div></div>
      </div>
      <pre class="code" id="tkCode" style="margin-top:14px"></pre>
    </section>
    <div class="ctrlbar" data-ctrl="tick"></div>
    <section class="panel">
      <div style="display:flex;gap:28px;align-items:center;flex-wrap:wrap">
        <div class="leds" id="tkLeds"></div>
        <div><span class="note" style="margin:0" id="tkNumL"></span><div class="bignum" id="tkNum"></div></div>
      </div>
      <div class="expl" id="tkExpl" style="margin-top:14px"></div>
    </section>
    <section class="panel">
      <h2 data-i="tk_h_time"></h2>
      <div class="scroll"><svg id="tkSvg" viewBox="0 0 1000 290" style="width:100%;min-width:700px;display:block" role="img"></svg></div>
      <div class="legend" id="tkLegend"></div>
    </section>
    <section class="panel">
      <h2 data-i="tk_h_stats"></h2>
      <div class="scroll"><table class="tbl" id="tkStats"></table></div>
      <p class="note" data-i="tk_stats_note"></p>
    </section>
  </div>

  <!-- ================= TIME SLICE ================= -->
  <div class="stack mod" id="mod-slice" hidden style="margin-top:0">
    <section class="panel">
      <h2 data-i="sl_h_setup"></h2>
      <div class="opts">
        <div class="opt"><label data-i="sl_l_slice"></label><div class="seg" id="slSlice"></div></div>
      </div>
      <p class="note" data-i="sl_note"></p>
    </section>
    <div class="ctrlbar" data-ctrl="slice"></div>
    <section class="panel">
      <h2 data-i="sl_h_us"></h2>
      <div class="scroll"><svg id="slRun" viewBox="0 0 1000 176" style="width:100%;min-width:640px;display:block" role="img"></svg></div>
      <div class="expl" id="slExpl" style="margin-top:12px"></div>
    </section>
    <section class="panel">
      <h2 data-i="sl_h_core"></h2>
      <div class="scroll"><svg id="slCore" viewBox="0 0 1000 78" style="width:100%;min-width:640px;display:block" role="img"></svg></div>
    </section>
  </div>

  <!-- ================= CONTEXT SWITCH ================= -->
  <div class="stack mod" id="mod-race" hidden style="margin-top:0">
    <section class="panel">
      <h2 data-i="rc_h_setup"></h2>
      <p class="note" style="margin:0" data-i="rc_note"></p>
    </section>
    <div class="ctrlbar" data-ctrl="race"></div>
    <section class="panel">
      <div class="threads" id="rcThreads"></div>
      <div class="expl" id="rcExpl" style="margin-top:14px"></div>
    </section>
    <section class="panel">
      <h2 data-i="rc_h_tried"></h2>
      <div id="rcTried"></div>
    </section>
  </div>

  <!-- ================= MUTEX ================= -->
  <div class="stack mod" id="mod-mutex" hidden style="margin-top:0">
    <section class="panel">
      <h2 data-i="mx_h_setup"></h2>
      <p class="note" style="margin:0" data-i="mx_note"></p>
    </section>
    <div class="ctrlbar" data-ctrl="mutex"></div>
    <section class="panel">
      <div class="threads" id="mxThreads"></div>
      <div class="expl" id="mxExpl" style="margin-top:14px"></div>
    </section>
    <section class="panel">
      <h2 data-i="rc_h_tried"></h2>
      <div id="mxTried"></div>
    </section>
  </div>

  <!-- ================= DEADLOCK ================= -->
  <div class="stack mod" id="mod-dead" hidden style="margin-top:0">
    <section class="panel">
      <h2 data-i="dl_h_setup"></h2>
      <div class="opts">
        <div class="opt"><label data-i="dl_l_b"></label><div class="seg" id="dlOrder"><button data-v="XY" data-i="dl_xy"></button><button data-v="YX" data-i="dl_yx"></button></div></div>
      </div>
      <p class="note" data-i="dl_note"></p>
    </section>
    <div class="ctrlbar" data-ctrl="dead"></div>
    <section class="panel">
      <div class="threads" id="dlThreads"></div>
      <div class="expl" id="dlExpl" style="margin-top:14px"></div>
    </section>
    <section class="panel">
      <h2 data-i="rc_h_tried"></h2>
      <div id="dlTried"></div>
    </section>
  </div>

  <!-- ================= PRODUCER-CONSUMER ================= -->
  <div class="stack mod" id="mod-pc" hidden style="margin-top:0">
    <section class="panel">
      <h2 data-i="pc_h_setup"></h2>
      <div class="opts">
        <div class="ctl"><label for="pcSize" data-i="pc_l_size"></label><input type="range" id="pcSize" min="1" max="8" step="1" value="5"><output id="pcSizeO"></output></div>
        <div class="ctl"><label for="pcPr" data-i="pc_l_pr"></label><input type="range" id="pcPr" min="1" max="10" step="1" value="3"><output id="pcPrO"></output></div>
        <div class="ctl"><label for="pcCr" data-i="pc_l_cr"></label><input type="range" id="pcCr" min="1" max="10" step="1" value="3"><output id="pcCrO"></output></div>
        <div class="opt"><label data-i="pc_l_rnd"></label><label class="chk"><input type="checkbox" id="pcRnd"><span data-i="pc_rnd"></span></label></div>
      </div>
      <div class="grid2e" style="margin-top:14px"><pre class="code" id="pcCode1"></pre><pre class="code" id="pcCode2"></pre></div>
    </section>
    <div class="ctrlbar" data-ctrl="pc"></div>
    <section class="panel">
      <div class="pcrow">
        <div class="thr" style="--c:var(--ta)"><div class="hd"><b data-i="pc_prod"></b><span id="pcStP"></span></div><div class="note" style="margin:0" id="pcInfoP"></div></div>
        <div><div class="slots" id="pcSlots"></div><p class="note" style="text-align:center" id="pcBufInfo"></p></div>
        <div class="thr" style="--c:var(--tb)"><div class="hd"><b data-i="pc_cons"></b><span id="pcStC"></span></div><div class="note" style="margin:0" id="pcInfoC"></div></div>
      </div>
      <div class="stats" id="pcStats" style="margin-top:14px"></div>
    </section>
    <section class="panel">
      <h2 data-i="pc_h_chart"></h2>
      <div class="scroll"><svg id="pcSvg" viewBox="0 0 1000 250" style="width:100%;min-width:640px;display:block" role="img"></svg></div>
      <div class="legend" id="pcLegend"></div>
      <div class="key" data-i="pc_key"></div>
    </section>
  </div>
</div>
</div>
</div>

/* stepper: prev / next / play / reset */
function Stepper(ctrlEl,getN,render,interval,label){
  const s={i:0,playing:false,timer:null};
  ctrlEl.innerHTML=`<div class="row">
    <button data-a="prev">${ICON.prev}<span data-i="a_prev"></span></button>
    <button data-a="next" class="primary"><span data-i="a_next"></span>${ICON.next}</button>
    <button data-a="play"><span class="ic">${ICON.play}</span><span class="lb"></span></button>
    <button data-a="reset">${ICON.reset}<span data-i="a_reset"></span></button></div>
    <div class="cyc"></div><p class="note" style="margin:0" data-i="keys_note"></p>`;
  const b=a=>ctrlEl.querySelector(`[data-a="${a}"]`);
  s.last=()=>getN()-1;
  s.sync=()=>{
    b('prev').disabled=s.i<=0; b('next').disabled=s.i>=s.last();
    b('play').querySelector('.ic').innerHTML=s.playing?ICON.pause:ICON.play;
    b('play').querySelector('.lb').textContent=t(s.playing?'a_pause':'a_play');
    ctrlEl.querySelector('.cyc').textContent=label?label(s.i):t('step',s.i,s.last());
  };
  s.go=i=>{s.i=Math.max(0,Math.min(s.last(),i));render();s.sync();};
  s.stop=()=>{s.playing=false;clearInterval(s.timer);s.timer=null;s.sync();};
  s.next=()=>{if(s.i<s.last())s.go(s.i+1);};
  s.prev=()=>{s.stop();s.go(s.i-1);};
  s.reset=()=>{s.stop();s.go(0);};
  s.play=()=>{if(s.i>=s.last())s.go(0);s.playing=true;
    s.timer=setInterval(()=>{if(s.i>=s.last())s.stop();else s.go(s.i+1);},interval||850);s.sync();};
  s.toggle=()=>s.playing?s.stop():s.play();
  b('prev').onclick=s.prev; b('next').onclick=()=>{s.stop();s.next();}; b('play').onclick=s.toggle; b('reset').onclick=s.reset;
  return s;
}

const IN_WIN=10000,IN_ISR_SLOW=600,IN_ISR_REAL=0.005,IN_RATE=0.2;  // work counter: 200 per second

      const d=Math.min(rem,IN.isrLeft);IN.isrLeft-=d;rem-=d;IN.t+=d;
      if(IN.isrLeft<=1e-9){IN.isrLeft=0;IN.presses++;IN.cur.b=IN.t;IN.cur=null;}

    [`  lcd.print(work);          // ${t('in_c_lcd')}`,inMain&&IN.playing?'act w':''],['}','']]);

    }
    const at=s.pc,mode=s.mode,ins=irFind(at);
    const chg=ins.x(s);
    if(!ins.jump)s.pc=at+(ins.n||4);
    let k='exec';
    if(!taken&&at===IR.at){pending=true;k='sig';}
    if(at===0x22C)k='mret';
    else if(taken&&mode==='main')after++;
    st.push({s:cl(s),k,chg,at,mode,e:ins.e(s),t0b:t0before,t1b:t1before});
  }
  IR.steps=st;
}

const TK={how:'timer',lcd:true,ev:null};   // loop() always writes to the LCD
const TK_P=[300,500,700],TK_MAX=32000,TK_N=TK_MAX/100+1,TK_W=4000;
function tkBuild(){
  const r=rng(11);
  const ch=[[],[],[]],cpu=[];
  const lcdDur=()=>2*(4+r()*8);  // two rows, each write several ms
  if(TK.how==='timer'){
    for(let i=0;i<3;i++)for(let k=1;k*TK_P[i]<=TK_MAX;k++)ch[i].push({t:k*TK_P[i],ideal:k*TK_P[i]});
    cpu.push({a:0,b:TK_MAX,k:'loop'});
    if(TK.lcd){let x=0;while(x<TK_MAX){const d=lcdDur();cpu.push({a:x,b:x+d,k:'lcd'});x+=d+1;}}
  }else if(TK.how==='millis'){
    const last=[0,0,0];let x=0;
    cpu.push({a:0,b:TK_MAX,k:'loop'});
    while(x<TK_MAX){
      for(let i=0;i<3;i++)if(x-last[i]>=TK_P[i]){last[i]+=TK_P[i];ch[i].push({t:x,ideal:last[i]});}
      if(TK.lcd){const d=lcdDur();cpu.push({a:x,b:x+d,k:'lcd'});x+=d+0.05;}
      else x=Math.min(...last.map((l,i)=>l+TK_P[i]));
    }
  }else{
    let x=0;const cnt=[0,0,0];
    outer:while(x<TK_MAX){
      for(let i=0;i<3;i++){
        cpu.push({a:x,b:x+TK_P[i],k:'delay',i});x+=TK_P[i];
        if(x>TK_MAX)break outer;
        cnt[i]++;ch[i].push({t:x,ideal:cnt[i]*TK_P[i]});
      }
      if(TK.lcd){const d=lcdDur();cpu.push({a:x,b:x+d,k:'lcd'});x+=d;}
    }
  }
  TK.ev={ch,cpu};
}

  $('tkSvg').innerHTML=o;
  let lg=legendItem('',t('tk_lg_ideal'),'border-left:2px dashed var(--isr);border-radius:0;width:2px')+legendItem('var(--ink)',t('tk_lg_change'))+legendItem('var(--bad)',t('tk_lg_late'))+

/* =====================================================================
   4. Kwant czasu / time slice
   ===================================================================== */
const SL_OPTS=[1000,500,100,50,10,1],SL_DUR=9000,SL_LAP=SL_DUR/3;
const SL={slice:1000,t:0,playing:false,lastTs:0,raf:0,bar:null};
const slOwner=ms=>['A','B','C'][Math.floor(ms/SL.slice)%3];
// how long task i (0, 1, 2) has had the core in [0, T)
function slOwn(i,T){
  const s=SL.slice,cyc=3*s,full=Math.floor(T/cyc);
  return full*s+Math.max(0,Math.min(s,T-full*cyc-i*s));
}
function slSegs(a,b){
  const out=[];let ms=a;
  while(ms<b){const o=slOwner(ms);const end=Math.min(b,(Math.floor(ms/SL.slice)+1)*SL.slice);out.push({o,a:ms,b:end});ms=end;}
  return out;
}
function slRender(){
  const T=SL.t,now=T>0&&T<SL_DUR?slOwner(Math.floor(T)):null;
  // the runners: each one moves only in its own time slices, from left to right
  {
    const X0=150,X1=960;let o='';
    ['A','B','C'].forEach((k,i)=>{
      const y=30+i*52;
      o+=txt(10,y+5,t('cx_task',k),{'font-weight':600});
      if(now)o+=txt(10,y+22,now===k?t('sl_runs'):t('sl_waits'),{'font-size':11.5,fill:now===k?'var(--ok)':'var(--muted)'});
      o+=svgEl('line',{x1:X0,y1:y,x2:X1,y2:y,stroke:'var(--rule)','stroke-width':6,'stroke-linecap':'round'});
      const f=Math.min(1,slOwn(i,T)/SL_LAP),x=X0+f*(X1-X0);
      o+=svgEl('line',{x1:X0,y1:y,x2:x,y2:y,stroke:TASKC[k],'stroke-width':6,'stroke-linecap':'round'});
      o+=`<text x="${-(x+14)}" y="${y+9}" transform="scale(-1,1)" style="font-size:28px">\u{1F3C3}</text>`;
    });
    $('slRun').innerHTML=o;
  }
  // who has the core, over the whole run
  {
    const X0=150,k=810/SL_DUR,X=ms=>X0+ms*k;let o='';
    o+=txt(10,34,t('sl_core'),{'font-weight':600});
    o+=rect(X0,12,810,36,'var(--sunken)');
    slSegs(0,Math.floor(T)).forEach(s=>{o+=rect(X(s.a),12,Math.max(X(s.b)-X(s.a),0.6),36,TASKC[s.o]);if(X(s.b)-X(s.a)>16)o+=txt((X(s.a)+X(s.b))/2,35,s.o,{'text-anchor':'middle','font-weight':600,fill:'var(--on-color)'});});
    for(let q=0;q<=9;q++)o+=txt(X(q*1000),68,q+' s',{'text-anchor':'middle','font-size':11.5,fill:'var(--muted)'});
    o+=svgEl('line',{x1:X(T),y1:6,x2:X(T),y2:54,stroke:'var(--ink)','stroke-width':1.5,'stroke-dasharray':'3 3'});
    $('slCore').innerHTML=o;
  }
  let e;
  if(T===0)e=[t('sl_x0_t'),t('sl_x0')];
  else if(SL.slice<=10)e=[t('sl_x_short_t'),t('sl_x_short',SL.slice)];
  else e=[t('sl_x_long_t'),t('sl_x_long',SL.slice)];
  $('slExpl').innerHTML=explHTML(e[0],e[1],'');
  SL.bar.sync(SL.playing,T===0?'a_start':'a_play',fix(T/1000,2)+' / 9 s',T>=SL_DUR);
  segSync($('slSlice'),SL.slice);
}
function slTick(ts){
  if(!SL.playing)return;
  const dt=SL.lastTs?Math.min(100,ts-SL.lastTs):0;SL.lastTs=ts;
  SL.t=Math.min(SL_DUR,SL.t+dt);
  if(SL.t>=SL_DUR)SL.playing=false;
  slRender();
  if(SL.playing)SL.raf=requestAnimationFrame(slTick);
}
function slPlay(){if(SL.t>=SL_DUR)return;SL.playing=true;SL.lastTs=0;cancelAnimationFrame(SL.raf);SL.raf=requestAnimationFrame(slTick);slRender();}
function slPause(){SL.playing=false;cancelAnimationFrame(SL.raf);slRender();}
function slReset(){slPause();SL.t=0;slRender();}
function slInit(){
  $('slSlice').innerHTML=SL_OPTS.map(v=>`<button data-v="${v}">${v>=1000?v/1000+' s':v+' ms'}</button>`).join('');
  segInit($('slSlice'),v=>{SL.slice=+v;slReset();});
  SL.bar=RunBar(document.querySelector('[data-ctrl="slice"]'),'sl_keys');
  SL.bar.on('play',()=>SL.playing?slPause():slPlay());
  SL.bar.on('reset',slReset);
}

   8-10. Wątki: wyścig, mutex, zakleszczenie / threads: race, mutex, deadlock
   ===================================================================== */
const THC={A:'var(--ta)',B:'var(--tb)'};
const other=k=>k==='A'?'B':'A';
function thrCard(k,lines,pc,state,regs,disabled,btnLabel,id){
  const code=lines.map((s,j)=>`<span class="l ${j<pc?'seen':''} ${j===pc&&state!=='done'?(state==='blk'?'act p':'act'):''}"><span class="pcm">${j===pc&&state!=='done'?'→':''}</span>${codeHTML(s)}</span>`).join('');
  return `<div class="thr ${state==='blk'?'blocked':''}" style="--c:${THC[k]}">
    <div class="hd"><b>${esc(t('th_thread',k))}</b>${pill(state==='done'?'done':state==='blk'?'blk':'ready')}</div>
    <pre class="code">${code}</pre>
    ${regs?`<div class="regs" style="margin-top:8px">${regs}</div>`:''}
    <button class="go" data-th="${k}" id="${id}" ${disabled?'disabled':''}>${esc(btnLabel)}</button></div>`;
}
function triedHTML(map,total,fmtRes){
  const n=map.size;
  let h=`<div class="stats" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))"><div class="stat"><span>${esc(t('rc_tried'))}</span><b>${total?esc(t('rc_k_of',n,total)):n}</b></div></div>`;
  if(!n)return h+`<p class="note">${esc(t('rc_tried_empty'))}</p>`;

const orderChips=o=>o.length?o.map(x=>`<span class="chip${x.endsWith('*')?' x':''}" style="--c:${THC[x[0]]}">${esc(x.endsWith('*')?x[0]+' ✕':x)}</span>`).join(''):`<span class="note" style="margin:0">${esc(t('rc_order_empty'))}</span>`;

/* ---------- race step by step ---------- */
const RC_INS=['lw   t0, counter','addi t0, t0, 1','sw   t0, counter'];
const RC={pc:{A:0,B:0},t0:{A:null,B:null},counter:5,order:[],tried:new Map(),last:null};

/* ---------- mutex ---------- */
const MX_INS=['lock(m)','lw   t0, counter','addi t0, t0, 1','sw   t0, counter','unlock(m)'];
const MX={};
function mxReset(){Object.assign(MX,{pc:{A:0,B:0},t0:{A:null,B:null},st:{A:'ready',B:'ready'},owner:null,counter:5,order:[],last:null});if(!MX.tried)MX.tried=new Map();mxRender();}
function mxStep(k){
  const i=MX.pc[k],o=other(k);if(MX.st[k]==='blk'||i>=5)return;
  let ev={k,i};
  if(i===0){
    if(MX.owner&&MX.owner!==k){MX.st[k]='blk';MX.order.push(k+'*');MX.last={k,i,blocked:true};mxRender();return;}
    MX.owner=k;
  }else if(i===1)MX.t0[k]=MX.counter;
  else if(i===2)MX.t0[k]++;
  else if(i===3)MX.counter=MX.t0[k];
  else{MX.owner=null;if(MX.st[o]==='blk'){MX.owner=o;MX.st[o]='ready';MX.pc[o]=1;ev.hand=o;}}
  MX.pc[k]++;MX.order.push(k);if(ev.hand)MX.order.push(ev.hand);
  if(MX.pc[k]>=5)MX.st[k]='done';
  MX.last=ev;
  if(MX.pc.A>=5&&MX.pc.B>=5){const key=MX.order.filter(x=>!x.endsWith('*')).join(' ');if(!MX.tried.has(key))MX.tried.set(key,MX.counter);}
  mxRender();
}
function mxRender(){

  $('mxThreads').innerHTML=card('A')+mid+card('B');

  else{
    const ins=MX_INS[l.i].replace(/\s+/g,' ');
    const s=[t('mx_e_lock',l.k),t('rc_e_lw',l.k,MX.t0[l.k]),t('rc_e_addi',l.k,MX.t0[l.k]),t('mx_e_sw',l.k,MX.counter),l.hand?t('mx_e_hand',l.k,l.hand):t('mx_e_unlock',l.k)][l.i];

/* ---------- deadlock ---------- */
const DL={b:'YX'};
const dlProg=k=>{
  const A=[['lock','X'],['lock','Y'],['work'],['unlock','Y'],['unlock','X']];
  if(k==='A'||DL.b==='XY')return A;
  return [['lock','Y'],['lock','X'],['work'],['unlock','X'],['unlock','Y']];
};
const dlTxt=i=>i[0]==='work'?'work()':`${i[0]}(${i[1]})`;
function dlReset(){Object.assign(DL,{pc:{A:0,B:0},st:{A:'ready',B:'ready'},held:{X:null,Y:null},wait:{A:null,B:null},steps:0,order:[],dead:false,last:null});if(!DL.tried)DL.tried=new Map();dlRender();}
function dlStep(k){
  if(DL.dead||DL.st[k]!=='ready')return;
  const P=dlProg(k),ins=P[DL.pc[k]],o=other(k);
  const ev={k,ins};
  if(ins[0]==='lock'){
    const m=ins[1];
    if(DL.held[m]&&DL.held[m]!==k){
      DL.st[k]='blk';DL.wait[k]=m;DL.order.push(k+'*');ev.blocked=true;
      if(DL.wait[o]&&DL.held[DL.wait[o]]===k&&DL.held[m]===o)DL.dead=true;
      DL.last=ev;
      if(DL.dead){const key=DL.order.join(' ');if(!DL.tried.has(key))DL.tried.set(key,'dead');}
      dlRender();return;
    }
    DL.held[m]=k;
  }else if(ins[0]==='unlock'){
    const m=ins[1];DL.held[m]=null;
    if(DL.wait[o]===m){DL.held[m]=o;DL.wait[o]=null;DL.st[o]='ready';DL.pc[o]++;DL.steps++;ev.hand=o;}
  }
  DL.pc[k]++;DL.steps++;DL.order.push(k);if(ev.hand)DL.order.push(ev.hand);
  ['A','B'].forEach(x=>{if(DL.pc[x]>=5)DL.st[x]='done';});
  DL.last=ev;
  if(DL.pc.A>=5&&DL.pc.B>=5){const key=DL.order.join(' ');if(!DL.tried.has(key))DL.tried.set(key,'ok');}
  dlRender();
}
function dlGraph(){
  const A=[48,110],B=[252,110],Xp=[150,36],Yp=[150,184];

    <marker id="dlArB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--tb)"/></marker>
    <marker id="dlArW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker></defs>`;
  const pos={A,B,X:Xp,Y:Yp};

    return p;
  };
  ['X','Y'].forEach(m=>{const h=DL.held[m];if(h)o+=edge(m,h,THC[h],h==='A'?'dlArA':'dlArB',false,t('dl_held'),h==='A'?1:-1);});
  ['A','B'].forEach(k=>{const m=DL.wait[k];if(m)o+=edge(k,m,'var(--bad)','dlArW',true,t('dl_waits'),k==='A'?1:-1);});

  o+=node('B',B,80,THC.B,t('th_thread','B'),DL.st.B==='blk');
  o+=node('X',Xp,52,'var(--shared)','🔒 X');
  o+=node('Y',Yp,52,'var(--shared)','🔒 Y');
  if(DL.dead)o+=txt(150,114,t('dl_circle'),{'text-anchor':'middle','font-weight':700,fill:'var(--bad)'});
  return `<svg viewBox="0 0 300 220" style="width:100%;max-width:340px;display:block;margin:0 auto" role="img">${o}</svg>`;
}
function dlRender(){
  const card=k=>{
    const P=dlProg(k).map(dlTxt);
    const st=DL.st[k];
    return thrCard(k,P,DL.pc[k],st,'',st!=='ready'||DL.dead,st==='blk'?t('th_waits_for',DL.wait[k]):t('th_step',k),'dlGo'+k);
  };

  if(DL.dead)banner=`<div class="banner bad">${esc(t('dl_dead'))}</div>`;

  else{

  }
  $('dlExpl').innerHTML=explHTML(e[0],e[1],'',e[2]);
  $('dlExpl').classList.toggle('bad',DL.dead);

  $('dlTried').innerHTML=triedHTML(DL.tried,0,v=>({ok:v==='ok',s:v==='ok'?t('dl_r_ok'):t('dl_r_dead')}));
  segSync($('dlOrder'),DL.b);
}

/* =====================================================================
   11. Producent-konsument / producer-consumer
   ===================================================================== */
const PCS={size:5,pr:3,cr:3,rnd:false,playing:false,raf:0,lastTs:0,bar:null,r:Math.random};
const PC_WIN=30;
function pcDur(rate){const m=1/rate;if(!PCS.rnd)return m;return Math.min(5*m,Math.max(0.15*m,-Math.log(1-PCS.r())*m));}
function pcReset(){
  Object.assign(PCS,{t:0,buf:[],next:1,prod:{st:'run',left:pcDur(PCS.pr),blk:0},cons:{st:'blk',left:0,blk:0,item:null},produced:0,consumed:0,hist:[],lastSample:-1});
  pcRender();
}
function pcStep(dt){
  const P=PCS.prod,C=PCS.cons;
  if(P.st==='run'){P.left-=dt;if(P.left<=0){if(PCS.buf.length<PCS.size){PCS.buf.push(PCS.next++);PCS.produced++;P.left+=pcDur(PCS.pr);}else{P.st='blk';P.left=0;}}}
  else{P.blk+=dt;if(PCS.buf.length<PCS.size){PCS.buf.push(PCS.next++);PCS.produced++;P.st='run';P.left=pcDur(PCS.pr);}}
  if(C.st==='run'){C.left-=dt;if(C.left<=0){PCS.consumed++;C.item=null;if(PCS.buf.length){C.item=PCS.buf.shift();C.left+=pcDur(PCS.cr);}else{C.st='blk';C.left=0;}}}
  else{C.blk+=dt;if(PCS.buf.length){C.item=PCS.buf.shift();C.st='run';C.left=pcDur(PCS.cr);}}
  // the producer may have been blocked on a full buffer that the consumer just emptied
  if(P.st==='blk'&&PCS.buf.length<PCS.size){PCS.buf.push(PCS.next++);PCS.produced++;P.st='run';P.left=pcDur(PCS.pr);}
  PCS.t+=dt;
  if(PCS.t-PCS.lastSample>=0.05||PCS.lastSample<0){PCS.hist.push({t:PCS.t,b:PCS.buf.length,p:P.st,c:C.st});PCS.lastSample=PCS.t;}
  while(PCS.hist.length&&PCS.hist[0].t<PCS.t-PC_WIN)PCS.hist.shift();
}
function pcRender(){

  $('pcInfoC').innerHTML=esc(C.st==='run'?t('pc_c_run',C.item):t('pc_c_blk'));

  o+=txt(10,yT+10,t('pc_r_fill'),{'font-weight':600,'font-size':12.5});

  }

  $('pcSvg').innerHTML=o;

  PCS.bar.sync(PCS.playing,PCS.t===0?'a_start':'a_play',fix(PCS.t,1)+' s');
  $('pcSizeO').textContent=PCS.size;$('pcPrO').textContent=t('pc_rate',PCS.pr);$('pcCrO').textContent=t('pc_rate',PCS.cr);
}
function pcFrame(ts){
  if(!PCS.playing)return;
  let dt=PCS.lastTs?Math.min(0.1,(ts-PCS.lastTs)/1000):0;PCS.lastTs=ts;
  while(dt>0){const d=Math.min(dt,0.01);pcStep(d);dt-=d;}

}
function pcPlay(){PCS.playing=true;PCS.lastTs=0;cancelAnimationFrame(PCS.raf);PCS.raf=requestAnimationFrame(pcFrame);pcRender();}
function pcPause(){PCS.playing=false;cancelAnimationFrame(PCS.raf);pcRender();}
function pcCode(){
  $('pcCode1').innerHTML=codeLines([['void producer() {',''],['  for (;;) {',''],['    int item = produce();          // '+t('pc_c_time'),''],
    ['    std::unique_lock<std::mutex> lock(m);',''],['    notFull.wait(lock, [] { return buffer.size() < SIZE; });',''],['    buffer.push(item);',''],['    notEmpty.notify_one();',''],['  }',''],['}','']]);
  $('pcCode2').innerHTML=codeLines([['void consumer() {',''],['  for (;;) {',''],['    std::unique_lock<std::mutex> lock(m);',''],
    ['    notEmpty.wait(lock, [] { return !buffer.empty(); });',''],['    int item = buffer.front(); buffer.pop();',''],['    notFull.notify_one();',''],['    lock.unlock();',''],['    consume(item);                 // '+t('pc_c_time'),''],['  }',''],['}','']]);
}
function pcInit(){
  PCS.bar=RunBar(document.querySelector('[data-ctrl="pc"]'),'');
  PCS.bar.on('play',()=>PCS.playing?pcPause():pcPlay());
  PCS.bar.on('reset',()=>{pcReset();});
  $('pcSize').addEventListener('input',e=>{PCS.size=+e.target.value;pcReset();});
  $('pcPr').addEventListener('input',e=>{PCS.pr=+e.target.value;pcRender();});
  $('pcCr').addEventListener('input',e=>{PCS.cr=+e.target.value;pcRender();});
  $('pcRnd').addEventListener('change',e=>{PCS.rnd=e.target.checked;});
  pcReset();
}

/* =====================================================================
   aplikacja / app
   ===================================================================== */
const MODS=['intr','irq','tick','slice','race','mutex','dead','pc'];
const GRPS={g6:['intr','irq','tick','slice'],g7:['race','mutex'],g8:['dead','pc']};
const GRP_OF={};for(const g in GRPS)GRPS[g].forEach(m=>GRP_OF[m]=g);
const lastIn={g6:'intr',g7:'race',g8:'dead'};
function openGrp(g){document.querySelectorAll('#topics .grp').forEach(el=>{const on=el.dataset.grp===g;el.classList.toggle('open',on);el.querySelector('.gh').setAttribute('aria-expanded',String(on));});}
function modHead(){const g=GRP_OF[cur];$('mhGrp').textContent=t('lect'+g.slice(1))+' · '+t(g+'n');$('mhTitle').textContent=t('tp_'+cur);$('mhSub').textContent=t('tp_'+cur+'_s');}
let cur='intr';
try{const h=location.hash.slice(1);if(MODS.includes(h))cur=h;else{const s=localStorage.getItem('ccSimMod');if(MODS.includes(s))cur=s;}}catch(e){}
function renderAll(){
  inRender();
  irFill();S.irq.go(S.irq.i);
  tkCode();segSync($('tkHow'),TK.how);S.tick.go(S.tick.i);
  slRender();
  rcRender();mxRender();dlRender();
  pcCode();pcRender();
}
function applyLang(){
  document.documentElement.lang=lang;document.title=t('doc_title');
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i);});
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  renderAll();modHead();
}
function showMod(m){
  ['irq','tick'].forEach(k=>S[k].stop());
  if(cur==='intr'&&m!=='intr')inPause();
  if(cur==='slice'&&m!=='slice')slPause();
  if(cur==='pc'&&m!=='pc')pcPause();
  cur=m;
  MODS.forEach(k=>{$('mod-'+k).hidden=k!==m;});
  document.querySelectorAll('#topics button[data-mod]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mod===m)));
  openGrp(GRP_OF[m]);lastIn[GRP_OF[m]]=m;modHead();
  try{localStorage.setItem('ccSimMod',m);history.replaceState(null,'','#'+m);}catch(e){}
  if(m==='pc'&&!PCS.playing)pcPlay();
}
document.querySelectorAll('#topics button[data-mod]').forEach(b=>b.addEventListener('click',()=>showMod(b.dataset.mod)));
document.querySelectorAll('#topics .gh').forEach(b=>b.addEventListener('click',()=>{
  const g=b.dataset.grp;
  if(GRP_OF[cur]===g){const el=b.parentElement;el.classList.toggle('open');b.setAttribute('aria-expanded',String(el.classList.contains('open')));}
  else showMod(lastIn[g]);
}));
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>{
  lang=b.dataset.lang;try{localStorage.setItem('ccSimLang',lang);}catch(e){}applyLang();
}));
const typing=e=>{const tg=e.target;return tg&&(tg.tagName==='INPUT'||tg.tagName==='SELECT'||tg.tagName==='TEXTAREA'||tg.isContentEditable);};
document.addEventListener('keydown',e=>{
  if(typing(e)||e.ctrlKey||e.metaKey||e.altKey)return;
  if(cur==='intr'){if(e.key===' '&&!e.repeat){e.preventDefault();inPress();}return;}
  if(cur==='race'||cur==='mutex'||cur==='dead'){
    const k=e.key.toUpperCase();
    if(k==='A'||k==='B'){e.preventDefault();({race:rcStep,mutex:mxStep,dead:dlStep})[cur](k);}
    else if(k==='R'){e.preventDefault();({race:rcReset,mutex:mxReset,dead:dlReset})[cur]();}
    return;
  }
  const s=S[cur];if(!s||!s.next)return;
  if(e.key==='ArrowRight'){e.preventDefault();s.stop();s.next();}
  else if(e.key==='ArrowLeft'){e.preventDefault();s.prev();}
  else if(e.key===' '&&!(e.target&&e.target.tagName==='BUTTON')){e.preventDefault();s.toggle();}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(MODS.includes(h)&&h!==cur)showMod(h);});

/* reset buttons for the thread topics */
function thrBar(id,reset,note){
  const c=document.querySelector(`[data-ctrl="${id}"]`);
  c.innerHTML=`<div class="row"><button data-a="reset">${ICON.reset}<span data-i="a_reset"></span></button></div><p class="note" style="margin:0" data-i="${note}"></p>`;
  c.querySelector('[data-a="reset"]').onclick=reset;
}
thrBar('race',rcReset,'th_keys');thrBar('mutex',mxReset,'th_keys');thrBar('dead',dlReset,'th_keys');
segInit($('dlOrder'),v=>{DL.b=v;dlReset();});

inInit();irInit();tkInit();slInit();pcInit();
rcReset();mxReset();dlReset();
applyLang();
showMod(cur);
})();
</script>
</body>
</html>
