<!DOCTYPE html>
<html lang="pl">
<head>
<script>(function(){try{if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embed');}catch(e){}})();</script>
<style>html.embed .wrap{max-width:none;padding:14px 18px 48px}html.embed header.topbar{display:none}html.embed .wrap>.stack{margin-top:0}html.embed .wrap>.stack>section.panel:first-child{display:none}</style>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Symulator wejścia-wyjścia: I2C, przerwania, DMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunken:#EAEEF2; --ink:#16202B; --muted:#5B6673; --rule:#D5DBE1; --focus:#2F6FDB;
  --ok:#1E7E4F; --ok-bg:#E2F3EA; --bad:#B8372B; --bad-bg:#FBE7E4;
  --work:#23914F; --work-bg:#DFF2E6; --poll:#C8453A; --poll-bg:#FBE4E1; --isr:#D9621C; --isr-bg:#FCE8DA;
  --copy:#1E78C8; --copy-bg:#DDEAF8; --idle:#BCC4CC; --idle-bg:#EEF1F4;
  --scl:#7C3AB4; --sda:#1E78C8; --dev:#23914F; --ss:#D9621C;
  --addr:#D9621C; --data:#1E78C8; --ctl:#7C3AB4;
  --lcd-bg:#A6CC4A; --lcd-ink:#1D3409; --lcd-frame:#2A3440;
  --on-color:#FFFFFF;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
    --ok:#5FD19A; --ok-bg:#15352A; --bad:#F08A7E; --bad-bg:#3E1C19;
    --work:#4CC283; --work-bg:#163427; --poll:#EE7F72; --poll-bg:#3E1C19; --isr:#F29A5C; --isr-bg:#3D2414;
    --copy:#5AA7EE; --copy-bg:#14293D; --idle:#4A5663; --idle-bg:#222C37;
    --scl:#B98BEA; --sda:#5AA7EE; --dev:#4CC283; --ss:#F29A5C;
    --addr:#F29A5C; --data:#5AA7EE; --ctl:#B98BEA;
    --lcd-bg:#7FA52E; --lcd-ink:#10200A; --lcd-frame:#0A0E12; --on-color:#0F1419;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#171E26; --sunken:#1E2731; --ink:#E6EBF0; --muted:#93A0AD; --rule:#2B3542; --focus:#7FA8F0;
  --ok:#5FD19A; --ok-bg:#15352A; --bad:#F08A7E; --bad-bg:#3E1C19;
  --work:#4CC283; --work-bg:#163427; --poll:#EE7F72; --poll-bg:#3E1C19; --isr:#F29A5C; --isr-bg:#3D2414;
  --copy:#5AA7EE; --copy-bg:#14293D; --idle:#4A5663; --idle-bg:#222C37;
  --scl:#B98BEA; --sda:#5AA7EE; --dev:#4CC283; --ss:#F29A5C;
  --addr:#F29A5C; --data:#5AA7EE; --ctl:#B98BEA;
  --lcd-bg:#7FA52E; --lcd-ink:#10200A; --lcd-frame:#0A0E12; --on-color:#0F1419;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 60px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
header h1{font-size:26px;font-weight:600;margin:0 0 4px;letter-spacing:-0.01em}
header p{margin:0;color:var(--muted);max-width:74ch}
.langs{display:flex;gap:6px}
.langs button{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:13px}
.langs button svg{width:22px;height:14px;border-radius:2px;box-shadow:0 0 0 1px var(--rule);display:block}
.langs button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken)}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;min-width:0}
h2{font-size:16px;font-weight:600;margin:0 0 10px}
h3{font-size:14px;font-weight:600;margin:0 0 6px}
label{font-size:13px;color:var(--muted)}
select,input[type=text]{font:inherit;font-family:var(--mono);font-size:14px;color:var(--ink);background:var(--sunken);border:1px solid var(--rule);border-radius:6px;padding:6px 9px}
button{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{background:var(--sunken)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button.primary:hover{opacity:.9}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.err{font-size:13px;color:var(--bad);margin:6px 0 0;min-height:1em}
.mono{font-family:var(--mono)}

/* topic picker */
.topics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:1100px){.topics{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.topics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.topics button{padding:9px 10px;font-size:14px;text-align:left;line-height:1.3;font-weight:600}
.topics button small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.topics button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken);box-shadow:inset 0 -3px 0 var(--ink)}
.topics button[aria-pressed="true"] small{color:var(--ink)}

/* control bar */
.ctrlbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 16px}
.ctrlbar button{display:inline-flex;align-items:center;gap:8px}
.ctrlbar svg{width:14px;height:14px}
.cyc{font-family:var(--mono);font-size:18px;font-weight:500}
.opts{display:flex;gap:14px 22px;flex-wrap:wrap;align-items:flex-end}
.opt{display:flex;flex-direction:column;gap:4px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 11px;font-size:13px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--ink);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--ink)}

/* explanation box */
.expl{display:flex;gap:12px;align-items:flex-start;background:var(--sunken);border-radius:8px;padding:12px 14px;border-left:4px solid var(--ink)}
.expl .bn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--isr);color:var(--on-color);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center}
.expl .bn:empty{display:none}
.expl b.t{display:block;font-size:15px}
.expl .who{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.expl p{margin:2px 0 0;font-size:14.5px}
.expl code,.note code,.tbl code{font-family:var(--mono);font-size:.92em}
.key{margin-top:10px;font-size:13.5px;padding:8px 12px;border:1px dashed var(--rule);border-radius:8px}

.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid3{grid-template-columns:minmax(0,1fr)}}
.scroll{overflow-x:auto}
svg text{font-family:var(--sans)}
svg .m{font-family:var(--mono)}

.code{margin:0;font-family:var(--mono);font-size:13px;line-height:1.6;background:var(--sunken);border-radius:8px;padding:10px 0;overflow-x:auto;white-space:pre}
.code .l{display:block;padding:0 14px;border-left:3px solid transparent}
.code .l.act{background:color-mix(in srgb,var(--isr) 16%,transparent);border-left-color:var(--isr)}
.code .l.act.w{background:color-mix(in srgb,var(--work) 16%,transparent);border-left-color:var(--work)}
.code .l.act.c{background:color-mix(in srgb,var(--copy) 16%,transparent);border-left-color:var(--copy)}
.code .l.act.p{background:color-mix(in srgb,var(--poll) 16%,transparent);border-left-color:var(--poll)}
.code .l.act.k{background:var(--ink);color:var(--surface);border-left-color:var(--ink)}
.code .l.act.k .c,.code .l.act.k .a{color:var(--surface);opacity:.8}
.code .l.seen{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.code .c{color:var(--muted)}
.code .a{color:var(--muted)}
.code .hl{color:var(--isr);font-weight:600}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--sunken);border-radius:8px;padding:7px 10px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-family:var(--mono);font-size:18px;font-weight:500}
.stat.good b{color:var(--ok)} .stat.bad b{color:var(--bad)}

.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;margin-top:8px;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td.mono{font-family:var(--mono)}

/* bits */
.bits{display:flex;gap:2px;font-family:var(--mono);font-size:13px;min-width:max-content}
.bit{width:19px;text-align:center;padding:3px 0;border-radius:3px;background:var(--sunken)}
.bit.gap{margin-left:7px}
.bit.hi{background:color-mix(in srgb,var(--addr) 22%,transparent)}
.bit.lo{background:color-mix(in srgb,var(--data) 20%,transparent)}
.bit.on{background:var(--ok);color:var(--on-color);font-weight:600}
.bit.x{background:var(--bad);color:var(--on-color);font-weight:600}
.bit.pend{background:transparent;border:1px dashed var(--rule);color:var(--muted)}
.bit.sel{outline:2px solid var(--isr);outline-offset:-2px;font-weight:600}
.bitnums{display:flex;gap:2px;font-family:var(--mono);font-size:10.5px;color:var(--muted);min-width:max-content}
.bitnums span{width:19px;text-align:center}
.bitnums span.gap{margin-left:7px}

/* status pills */
.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.act{background:var(--isr-bg);color:var(--isr)} .pill.info{background:var(--copy-bg);color:var(--copy)}

/* LCD */
.lcd{display:inline-block;background:var(--lcd-frame);padding:9px;border-radius:8px}
.lcd pre{margin:0;background:var(--lcd-bg);color:var(--lcd-ink);font-family:var(--mono);font-weight:600;font-size:16px;line-height:1.35;padding:6px 10px;border-radius:3px;letter-spacing:.06em}

/* big press button */
.bigbtn{display:inline-flex;flex-direction:column;align-items:center;gap:6px;user-select:none;-webkit-user-select:none;touch-action:none}
.bigbtn button{width:92px;height:92px;border-radius:50%;border:8px solid var(--lcd-frame);background:var(--work);color:var(--on-color);font-weight:600;font-size:15px;box-shadow:0 5px 0 color-mix(in srgb,var(--work) 55%,#000);transition:transform .05s,box-shadow .05s}
.bigbtn button:hover{background:var(--work);filter:brightness(1.05)}
.bigbtn button.down{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--work) 55%,#000)}

@media (prefers-reduced-motion:no-preference){
  .flash{animation:fl .6s ease-out}
  @keyframes fl{from{box-shadow:0 0 0 3px var(--isr)}to{box-shadow:0 0 0 3px transparent}}
}

/* I2C */
.devtbl td .bits{display:inline-flex}
/* MMIO */
.regs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.reg{background:var(--sunken);border-radius:7px;padding:6px 10px;border:1px solid transparent}
.reg span{display:block;font-size:12px;color:var(--muted)}
.reg b{font-family:var(--mono);font-size:15px;font-weight:500}
.reg.chg{border-color:var(--isr);background:var(--isr-bg)}
/* IRQ */
.codecols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:980px){.codecols{grid-template-columns:minmax(0,1fr)}}
.strip{display:flex;gap:3px;flex-wrap:wrap}
.strip span{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:4px;color:var(--on-color)}
.strip .m{background:var(--work)} .strip .t{background:transparent;color:var(--isr);border:1.5px dashed var(--isr);padding:1px 5px}
.strip .i{background:var(--isr)} .strip .x{background:var(--bad)}
.serial{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.5;background:#15191E;color:#E8ECEF;border-radius:8px;padding:10px 14px;overflow-x:auto;white-space:pre}
.serial .r{color:#FF8A7A;font-weight:600}
/* DMA */
.memgrid{display:grid;grid-template-columns:repeat(8,minmax(26px,1fr));gap:3px;font-family:var(--mono);font-size:13px}
.memgrid div{text-align:center;padding:4px 0;border-radius:4px;background:var(--sunken);border:1px solid var(--rule)}
.memgrid div.full{background:var(--copy-bg);border-color:color-mix(in srgb,var(--copy) 45%,transparent)}
.memgrid div.now{background:var(--copy);color:var(--on-color);border-color:var(--copy)}
.memgrid div.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.progress{height:10px;border-radius:5px;background:var(--sunken);overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--copy);transition:width .25s}
.checks{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.checks li{padding:5px 10px;border-radius:6px;background:var(--sunken);border-left:3px solid var(--rule)}
.checks li.ok{border-left-color:var(--ok)} .checks li.bad{border-left-color:var(--bad)}
.calc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.calc{grid-template-columns:repeat(2,minmax(0,1fr))}}
.calc input{width:100%}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.presets button{font-size:13px;padding:5px 10px}
.presets button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken)}
.bar{position:relative;height:26px;border-radius:6px;background:var(--work-bg);overflow:hidden;margin-top:10px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--isr)}
.bar span{position:absolute;left:10px;top:3px;font-size:13px;font-weight:600;font-family:var(--mono);color:var(--ink)}
.formula{font-family:var(--mono);font-size:14px;background:var(--sunken);border-radius:8px;padding:10px 14px;margin-top:10px;overflow-x:auto;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
<header class="topbar">
  <div>
    <h1 data-i="title"></h1>
    <p data-i="intro"></p>
  </div>
  <div class="langs" role="group" aria-label="Język / Language">
    <button data-lang="pl" aria-pressed="false"><svg viewBox="0 0 16 10" aria-hidden="true"><rect width="16" height="5" fill="#fff"/><rect y="5" width="16" height="5" fill="#DC143C"/></svg>PL</button>
    <button data-lang="en" aria-pressed="false"><svg viewBox="0 0 60 30" aria-hidden="true"><clipPath id="ukS"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="ukT"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#ukS)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukT)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>EN</button>
  </div>
</header>

<div class="stack">
  <section class="panel">
    <h2 data-i="h_topics"></h2>
    <div class="topics" id="topics">
      <button data-mod="i2c"><span data-i="tp_i2c"></span><small data-i="tp_i2c_s"></small></button>
      <button data-mod="mmio"><span data-i="tp_mmio"></span><small data-i="tp_mmio_s"></small></button>
      <button data-mod="gpio"><span data-i="tp_gpio"></span><small data-i="tp_gpio_s"></small></button>
      <button data-mod="poll"><span data-i="tp_poll"></span><small data-i="tp_poll_s"></small></button>
      <button data-mod="irq"><span data-i="tp_irq"></span><small data-i="tp_irq_s"></small></button>
      <button data-mod="dma"><span data-i="tp_dma"></span><small data-i="tp_dma_s"></small></button>
    </div>
  </section>

  <!-- ================= I2C ================= -->
  <div class="stack mod" id="mod-i2c" hidden style="margin-top:0">
    <section class="panel">
      <h2 data-i="i2c_h_setup"></h2>
      <div class="opts">
        <div class="opt"><label for="i2cAddr" data-i="i2c_l_addr"></label><select id="i2cAddr"></select></div>
        <div class="opt"><label data-i="i2c_l_rw"></label><div class="seg" id="i2cRw"><button data-v="w" data-i="i2c_w"></button><button data-v="r" data-i="i2c_r"></button></div></div>
        <div class="opt" id="i2cDataWrap"><label for="i2cData" data-i="i2c_l_data"></label><input type="text" id="i2cData" value="0x48" size="6" autocomplete="off" spellcheck="false"></div>
      </div>
      <p class="err" id="i2cErr"></p>
      <pre class="code" id="i2cCode"></pre>
    </section>
    <div class="ctrlbar" data-ctrl="i2c"></div>
    <section class="panel">
      <h2 data-i="i2c_h_bus"></h2>
      <div class="scroll"><svg id="i2cBus" viewBox="0 0 900 215" style="width:100%;min-width:640px;display:block" role="img"></svg></div>
    </section>
    <section class="panel">
      <h2 data-i="i2c_h_wave"></h2>
      <div class="scroll"><svg id="i2cWave" style="display:block" role="img"></svg></div>
      <div class="legend" id="i2cLegend"></div>
      <div class="expl" id="i2cExpl" style="margin-top:12px"></div>
      <div class="key" data-i="i2c_rule"></div>
    </section>
    <section class="panel">
      <h2 data-i="i2c_h_devs"></h2>
      <div class="scroll"><table class="tbl devtbl" id="i2cDevs"></table></div>
      <p class="note" data-i="i2c_devs_note"></p>
    </section>
  </div>

  <!-- ================= MMIO ================= -->
  <div class="stack mod" id="mod-mmio" hidden style="margin-top:0">
    <section class="panel">
      <h2 data-i="mm_h_pick"></h2>
      <div class="presets" id="mmPresets"></div>
      <details id="mmCustom"><summary data-i="mm_custom"></summary>
        <div class="opts" style="margin-top:10px">
          <div class="opt"><label for="mmOp" data-i="mm_l_op"></label><select id="mmOp"><option value="sw">sw</option><option value="lw">lw</option></select></div>
          <div class="opt"><label for="mmAddr" data-i="mm_l_addr"></label><input type="text" id="mmAddr" value="0x60004008" size="12" autocomplete="off" spellcheck="false"></div>
          <div class="opt"><label for="mmVal" data-i="mm_l_val"></label><input type="text" id="mmVal" value="0x10" size="12" autocomplete="off" spellcheck="false"></div>
          <div class="opt"><button class="primary" id="mmGo" data-i="mm_go"></button></div>
        </div>
        <p class="err" id="mmErr"></p>
      </details>
    </section>
    <div class="ctrlbar" data-ctrl="mmio"></div>
    <section class="panel">

/* stepper: prev / next / play / reset */
function Stepper(ctrlEl,getN,render,interval){
  const s={i:0,playing:false,timer:null};
  ctrlEl.innerHTML=`<div class="row">
    <button data-a="prev">${ICON.prev}<span data-i="a_prev"></span></button>
    <button data-a="next" class="primary"><span data-i="a_next"></span>${ICON.next}</button>
    <button data-a="play"><span class="ic">${ICON.play}</span><span class="lb"></span></button>
    <button data-a="reset">${ICON.reset}<span data-i="a_reset"></span></button></div>
    <div class="cyc"></div><p class="note" style="margin:0" data-i="keys_note"></p>`;
  const b=a=>ctrlEl.querySelector(`[data-a="${a}"]`);
  s.last=()=>getN()-1;
  s.sync=()=>{
    b('prev').disabled=s.i<=0; b('next').disabled=s.i>=s.last();
    b('play').querySelector('.ic').innerHTML=s.playing?ICON.pause:ICON.play;
    b('play').querySelector('.lb').textContent=t(s.playing?'a_pause':'a_play');
    ctrlEl.querySelector('.cyc').textContent=t('step',s.i,s.last());
  };
  s.go=i=>{s.i=Math.max(0,Math.min(s.last(),i));render();s.sync();};
  s.stop=()=>{s.playing=false;clearInterval(s.timer);s.timer=null;s.sync();};
  s.next=()=>{if(s.i<s.last())s.go(s.i+1);};
  s.prev=()=>{s.stop();s.go(s.i-1);};
  s.reset=()=>{s.stop();s.go(0);};
  s.play=()=>{if(s.i>=s.last())s.go(0);s.playing=true;
    s.timer=setInterval(()=>{if(s.i>=s.last())s.stop();else s.go(s.i+1);},interval||850);s.sync();};
  s.toggle=()=>s.playing?s.stop():s.play();
  b('prev').onclick=s.prev; b('next').onclick=()=>{s.stop();s.next();}; b('play').onclick=s.toggle; b('reset').onclick=s.reset;
  return s;
}
function segInit(el,cb){
  el.querySelectorAll('button').forEach(bt=>bt.addEventListener('click',()=>cb(bt.dataset.v)));
}
function segSync(el,v){el.querySelectorAll('button').forEach(bt=>bt.setAttribute('aria-pressed',String(bt.dataset.v===v)));}
function svgEl(tag,attrs,text){
  let a='';for(const k in attrs)if(attrs[k]!==undefined&&attrs[k]!==null)a+=` ${k}="${attrs[k]}"`;
  return `<${tag}${a}>${text!==undefined?text:''}</${tag}>`;
}

const I2C_DEVS=[{a:0x27,k:'dev_lcd',rd:0x08},{a:0x68,k:'dev_sensor',rd:0x1A},{a:0x50,k:'dev_mem',rd:0x41}];

const I={addr:0x27,rw:'w',data:0x48,slots:[]};
const i2cDev=()=>I2C_DEVS.find(d=>d.a===I.addr);
function i2cBuild(){
  const a=I.addr,rd=I.rw==='r',dev=i2cDev(),s=[];
  let g=0;

  for(let b=6;b>=0;b--)s.push({k:'addr',drv:'m',v:(a>>b)&1,n:7-b,g});
  g++; s.push({k:'rw',drv:'m',v:rd?1:0,g:g++});
  if(!dev){s.push({k:'ack',drv:'n',v:1,nack:true,after:'addr',g:g++});s.push({k:'stop',drv:'m',v:1,g:g++});I.slots=s;return;}

function parseNum(v){

const GP_BASE=0x60004000;

const gpCx=n=>250+(7-n)*96;
function gpKind(n){

}
function gpLevel(n){const k=gpKind(n);return k==='drv1'||k==='pu'?1:k==='drv0'||k==='press'?0:k==='short'?'!':'?';}
function gpInStr(){let s='';for(let n=7;n>=0;n--){const l=gpLevel(n);s+=l===1||l===0?l:'?';}return s;}

const gpPin=n=>t('gp_ps_'+gpKind(n),n);
function gpAsm(reg,val,op){

function gpWrite(reg,val,cLine,extra){

/* =====================================================================
   Polling a przerwania / polling vs interrupts
   ===================================================================== */
const PDUR=10000,SPIN_RATE=40000;
const P={t:0,playing:false,presses:[],hold:null,mode:'work',bounce:false,deb:false,lastTs:0,raf:0,started:false};
function poCompute(tn){
  const pr=P.presses.filter(p=>p.a<=tn).map(p=>({a:p.a,b:p.b===null?Infinity:p.b,vb:Math.min(p.b===null?tn:p.b,tn)}));
  const edges=[];
  pr.forEach((p,i)=>{const k=P.bounce?3:1;for(let j=0;j<k;j++){const e={t:p.a+j*2,vis:p.a+j*60,press:i};if(e.t<=tn)edges.push(e);}});
  let irq=0,lastT=-1e9;
  edges.forEach(e=>{e.counted=!P.deb||(e.t-lastT>=50);if(e.counted){irq++;lastT=e.t;}});
  const pressInfo=pr.map((p,i)=>({irq:edges.filter(e=>e.press===i&&e.counted).length,poll:0}));
  let poll=0,checks=0,checkList=[];
  if(P.mode==='work'){
    for(let c=2000;c<=PDUR;c+=2000){
      if(c>tn)break;
      const hitI=pr.findIndex(p=>c>=p.a&&c<p.b);
      checkList.push({t:c,hit:hitI>=0});
      if(hitI>=0){poll++;pressInfo[hitI].poll++;}
    }
    checks=checkList.length;
  }else{
    checks=Math.floor(tn/1000*SPIN_RATE);
    pr.forEach((p,i)=>{const k=P.bounce?3:1;const n=[...Array(k).keys()].filter(j=>p.a+j*2<=tn).length;poll+=n;pressInfo[i].poll=n;});
  }
  return {pr,edges,irq,poll,checks,checkList,pressInfo};
}
const PX=t0=>152+t0*0.082;
function poSvg(C){
  const tn=P.t;let o='';

  o+=svgEl('line',{x1:PX(0),y1:204,x2:PX(PDUR),y2:204,stroke:'var(--rule)','stroke-width':1.5});

  let pts=[[PX(0),yH]];

    else ys.push([p.a,yL]);
    ys.forEach(([tt,y])=>{const x=PX(tt);const prevY=pts[pts.length-1][1];pts.push([x,prevY]);pts.push([x,y]);});
    const endV=Math.max(p.vb,p.a+(P.bounce?120:0));

      const cx=PX(b)-7;
      o+=blk(cx,cx+7,pY,'var(--poll)',b<=tn?1:.3);
    }
    C.checkList.forEach(c=>{o+=txt(PX(c.t)-4,pY-5,c.hit?'+1':'✕',{'text-anchor':'middle','font-size':11.5,'font-weight':600,fill:c.hit?'var(--ok)':'var(--muted)'});});
  }else{
    o+=blk(PX(0),PX(PDUR),pY,'var(--poll)',.16);
    if(tn>0){o+=blk(PX(0),PX(tn),pY,'var(--poll)',.9);o+=blk(PX(0),PX(tn),pY,'url(#poHatch)',1);}
  }
  // interrupt row
  o+=blk(PX(0),PX(PDUR),iY,'var(--work)',.18);
  if(tn>0)o+=blk(PX(0),PX(tn),iY,'var(--work)',.9);
  C.edges.forEach(e=>{
    const x=PX(e.vis);
    if(e.counted)o+=blk(x,x+6,iY,'var(--isr)',1);
    else o+=blk(x,x+6,iY,'var(--surface)',1,{stroke:'var(--isr)','stroke-width':1.5});
  });
  // press markers
  C.pr.forEach((p,i)=>{
    const x=PX(p.a)+3,inf=C.pressInfo[i];
    const nc=Math.ceil((p.a+1)/2000)*2000,decided=P.mode==='spin'||nc<=tn;
    const pc=inf.poll>0?'var(--ok)':decided?'var(--bad)':'var(--muted)';
    o+=svgEl('circle',{cx:x,cy:pY+bh+8,r:5,fill:pc});
    o+=svgEl('circle',{cx:x,cy:iY+bh+8,r:5,fill:inf.irq>0?'var(--ok)':'var(--bad)'});
    if(inf.irq>1)o+=txt(x+8,iY+bh+12,'×'+inf.irq,{'font-size':11,'font-weight':600,fill:'var(--bad)'});
    if(inf.poll>1)o+=txt(x+8,pY+bh+12,'×'+inf.poll,{'font-size':11,'font-weight':600,fill:'var(--isr)'});
  });
  // cursor
  o+=svgEl('line',{x1:PX(tn),y1:22,x2:PX(tn),y2:204,stroke:'var(--ink)','stroke-width':1.5,'stroke-dasharray':'3 3'});
  const defs=`<defs><pattern id="poHatch" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="1.5" height="6" fill="var(--surface)" opacity=".45"/></pattern></defs>`;
  $('poSvg').innerHTML=defs+o;
}

function poStats(C){

function poExpl(C){

function poCode(C){
  const tn=P.t,lastCheck=C.checkList.length?C.checkList[C.checkList.length-1].t:-1e9;
  const recentCheck=P.mode==='work'&&tn-lastCheck<350&&tn>0;
  const running=P.playing||(tn>0&&tn<PDUR);
  let L;
  if(P.mode==='work'){
    L=[['void loop() {',''],[`  delay(2000);                    ${t('pc_work')}`,running&&!recentCheck?'w':''],
       [`  if (digitalRead(BTN_A) == LOW)  ${t('pc_check')}`,recentCheck?'p':''],['    count++;',recentCheck&&C.checkList[C.checkList.length-1].hit?'p':''],

  }else{
    L=[['void loop() {',''],[`  int now = digitalRead(BTN_A);    ${t('pc_spin')}`,running?'p':''],['  checks++;',running?'p':''],
       ['  if (last == HIGH && now == LOW) presses++;',''],['  last = now;',running?'p':''],['}','']];
  }

  else R=[['void IRAM_ATTR onPress() {',hot?'i':''],['  count++;',hot?'i':''],['}',''],['',''],['attachInterrupt(digitalPinToInterrupt(BTN_A),',''],['                onPress, FALLING);','']];

function poRender(){

function poTick(ts){
  if(!P.playing)return;
  const dt=P.lastTs?Math.min(100,ts-P.lastTs):0;P.lastTs=ts;

  if(P.t>=PDUR){if(P.hold){P.hold.b=PDUR;P.hold=null;$('poBtn').classList.remove('down');}P.playing=false;}
  poRender();
  if(P.playing)P.raf=requestAnimationFrame(poTick);
}
function poPlay(){if(P.t>=PDUR)return;P.playing=true;P.lastTs=0;cancelAnimationFrame(P.raf);P.raf=requestAnimationFrame(poTick);poRender();}
function poPause(){P.playing=false;cancelAnimationFrame(P.raf);poRender();}

function poDown(){
  if(P.hold||P.t>=PDUR)return;

function poUp(){

}

/* =====================================================================
   Przerwanie krok po kroku / interrupt step by step
   ===================================================================== */
const MA=i=>(0x42000100+4*i)>>>0, VA=i=>(0x42000400+4*i)>>>0, HA=i=>(0x42000500+4*i)>>>0;
const IR_MAIN=['add  a1, a1, a0','lw   a0, 0(s0)','addi s0, s0, 4','sw   a1, 0(s1)','bnez t0, loop'];
const IR_BAD='lw   a0, 0(zero)';
const IR_H={
  A:{name:'onA',lines:[['sw   t0, 0(sp)','save'],['lw   t0, 0(gp)','ld','# t0 = count'],['addi t0, t0, 1','inc','# t0 + 1'],['sw   t0, 0(gp)','st','# count = t0'],['lw   t0, 0(sp)','rest'],['mret','ret']]},
  B:{name:'onB',lines:[['sw   zero, 0(gp)','zero','# count = 0'],['mret','ret']]},
  T:{name:'onTimer',lines:[['sw   t0, 0(sp)','save'],['lw   t0, 4(gp)','ld','# t0 = ledOn'],['xori t0, t0, 1','xor','# !ledOn'],['sw   t0, 4(gp)','st','# ledOn = t0'],['lw   t0, 0(sp)','rest'],['mret','ret']]},
  X:{name:'trap_exc',lines:[['call panic_handler','panic']]},
};
const R={src:'A',at:1,trace:[]};
const irIns=i=>R.src==='X'&&i===1?IR_BAD:IR_MAIN[i];
const irShort=s=>s.replace(/\s+/g,' ');
function irBuild(){
  const src=R.src,at=src==='X'?1:R.at,st=[];
  const regs={pc:MA(0),mepc:null,mcause:null,mtval:null,count:3,led:0,t0:7};
  const push=o=>st.push(Object.assign({regs:Object.assign({},regs)},o));
  for(let i=0;i<at;i++){regs.pc=MA(i);push({w:'main',line:i,kind:'run',strip:['m',irShort(irIns(i))]});}
  regs.pc=MA(at);
  if(src==='X'){
    push({w:'main',line:at,kind:'fault',badge:1,strip:['x',irShort(irIns(at))]});
    regs.mepc=MA(at);regs.mcause=5;regs.mtval=0;push({w:'hw',line:at,kind:'xsave',badge:2,strip:['t','trap']});
    regs.pc=VA(0);push({w:'vec',line:0,kind:'xjump',badge:3,strip:['i','j trap_exc']});
    regs.pc=HA(0);push({w:'hand',line:0,kind:'panic',strip:['i','panic']});
    R.trace=st;return;
  }
  push({w:'main',line:at,kind:'irq',badge:1,strip:['m',irShort(irIns(at))]});
  const n={A:1,B:2,T:3}[src],nx=at===4?0:at+1;
  regs.mepc=MA(nx);regs.mcause=(0x80000000|n)>>>0;push({w:'hw',line:at,kind:'save',badge:2,n,nx,strip:['t','trap']});
  regs.pc=VA(n);push({w:'vec',line:n,kind:'jump',badge:3,n,strip:['i','j '+IR_H[src].name]});
  IR_H[src].lines.forEach((L,j)=>{
    regs.pc=HA(j);
    switch(L[1]){
      case 'ld':regs.t0=src==='T'?regs.led:regs.count;break;
      case 'inc':regs.t0=regs.t0+1;break;
      case 'xor':regs.t0=regs.t0^1;break;
      case 'st':if(src==='T')regs.led=regs.t0;else regs.count=regs.t0;break;
      case 'rest':regs.t0=7;break;
      case 'zero':regs.count=0;break;
    }
    push({w:'hand',line:j,kind:L[1]==='ret'?'ret':'h',hk:L[1],badge:L[1]==='ret'?4:'',strip:['i',irShort(L[0])]});
  });
  for(let k=0;k<2;k++){
    const i=(nx+k)%5;regs.pc=MA(i);
    push({w:'main',line:i,kind:k===1?'end':'cont',strip:['m',irShort(irIns(i))]});
  }
  R.trace=st;
}
function irCodePanel(el,rows,cur,seen){
  el.innerHTML=rows.map((r,i)=>{
    let cl='l';
    if(cur&&cur.i===i)cl+=' act'+(cur.c?' '+cur.c:'');
    else if(seen.has(i))cl+=' seen';
    return `<span class="${cl}"><span class="a">${hexN(r.a,8).slice(-4)}  </span>${codeHTML(r.s)}</span>`;
  }).join('');
}
function irRender(){
  const i=S.irq.i,s=R.trace[i],src=R.src,H=IR_H[src];
  const prev=i>0?R.trace[i-1].regs:s.regs;
  // code panels
  const seenM=new Set(),seenV=new Set(),seenH=new Set();
  R.trace.slice(0,i).forEach(x=>{if(x.w==='main')seenM.add(x.line);if(x.w==='vec')seenV.add(x.line);if(x.w==='hand')seenH.add(x.line);});
  const mainRows=IR_MAIN.map((_,k)=>({a:MA(k),s:(k===0?'loop: ':'      ')+irIns(k)+(R.src==='X'&&k===1?'   '+t('irc_bad'):'')}));
  const vecRows=[0,1,2,3].map(k=>({a:VA(k),s:`j ${['trap_exc','onA','onB','onTimer'][k]}`.padEnd(13)+'# '+t('irc_v'+k)}));
  const hRows=H.lines.map((L,k)=>({a:HA(k),s:(k===0?H.name+':':'').padEnd(10)+L[0]+(L[2]?'  '+L[2]:L[1]==='save'?'  # '+t('irc_save'):L[1]==='rest'?'  # '+t('irc_rest'):L[1]==='panic'?'  # '+t('irc_panic'):'')}));
  let cM=null,cV=null,cH=null;
  if(s.w==='main')cM={i:s.line,c:s.kind==='fault'?'p':s.kind==='irq'?'':'k'};
  if(s.w==='hw')cM={i:s.line,c:src==='X'?'p':''};
  if(s.w==='vec')cV={i:s.line,c:''};
  if(s.w==='hand')cH={i:s.line,c:''};
  irCodePanel($('irMain'),mainRows,cM,seenM);
  irCodePanel($('irVec'),vecRows,cV,seenV);
  irCodePanel($('irHand'),hRows,cH,seenH);
  $('irHandH').textContent=t('ir_hand',H.name);
  // explanation
  const srcN=src==='X'?'':t('ir_src_name')[src];
  const ins=`<code>${esc(irShort(irIns(s.line||0)))}</code>`;
  let e;
  switch(s.kind){
    case 'run':e=t('irx_run',`<code>${esc(irShort(irIns(s.line)))}</code>`,hexA(MA(s.line)));break;
    case 'irq':e=t('irx_irq',srcN,ins);break;
    case 'save':e=t('irx_save',`<code>${hexA(MA(s.nx))}</code>`,`<code>${hexA(s.regs.mcause)}</code>`,s.n,R.at===4);break;
    case 'jump':e=t('irx_jump',s.n,`<code>${hexA(VA(s.n))}</code>`,`<code>${H.name}</code>`);break;
    case 'h':e=t('irx_h',t('irh')[s.hk]);break;
    case 'ret':e=t('irx_ret',`<code>${hexA(s.regs.mepc)}</code>`);break;
    case 'cont':e=t('irx_cont',`<code>${esc(irShort(irIns(s.line)))}</code>`);break;
    case 'end':e=t('irx_end',t('ire_'+src)+'<br>'+esc(t('ir_cmp')));break;
    case 'fault':e=t('irx_fault',ins);break;
    case 'xsave':e=t('irx_xsave',`<code>${hexA(MA(1))}</code>`);break;
    case 'xjump':e=t('irx_xjump',`<code>${hexA(VA(0))}</code>`);break;
    case 'panic':{const p=t('irx_panic');e=[p[0],p[1],p[2]+'<br>'+esc(t('ir_cmp'))];break;}
  }
  $('irExpl').innerHTML=explHTML(e,s.badge||'');
  // registers
  const r=s.regs,dash='—';
  const mc=r.mcause===null?dash:hexA(r.mcause)+'  ('+(r.mcause&0x80000000?t('mc_irq',r.mcause&0xFF):t('mc_exc'))+')';
  const items=[['PC',hexA(r.pc),r.pc!==prev.pc],['mepc',r.mepc===null?dash:hexA(r.mepc),r.mepc!==prev.mepc],['mcause',mc,r.mcause!==prev.mcause],
    ['mtval',r.mtval===null?dash:hexA(r.mtval),r.mtval!==prev.mtval],['mtvec',hexA(VA(0)),false],['t0',String(r.t0),r.t0!==prev.t0],
    ['count',String(r.count),r.count!==prev.count],['ledOn',String(r.led),r.led!==prev.led]];
  $('irRegs').innerHTML=items.map(([k,v,c])=>`<div class="reg${c&&i>0?' chg':''}"><span class="mono">${k}</span><b>${esc(v)}</b></div>`).join('');
  // strip
  $('irStrip').innerHTML=R.trace.slice(0,i+1).map(x=>`<span class="${x.strip[0]}">${esc(x.strip[1]==='trap'?t('ir_trap'):x.strip[1])}</span>`).join('');
  const it=(c,l)=>`<span><span class="sw" style="${c}"></span>${esc(l)}</span>`;
  $('irLegend').innerHTML=it('background:var(--work)',t('ir_lg_m'))+it('border:1.5px dashed var(--isr)',t('ir_lg_t'))+it('background:var(--isr)',t('ir_lg_i'))+(src==='X'?it('background:var(--bad)',t('ir_lg_x')):'');
  // serial monitor
  const ser=$('irSerial');
  if(s.kind==='panic'){
    ser.hidden=false;
    ser.innerHTML=`Guru Meditation Error: Core  0 panic'ed (<span class="r">Load access fault</span>). Exception was unhandled.\nMEPC    : <span class="r">0x42000104</span>  RA      : 0x420000F8\nMCAUSE  : <span class="r">0x00000005</span>  MTVAL   : <span class="r">0x00000000</span>`;
  }else ser.hidden=true;
}
function irFill(){
  segSync($('irSrc'),R.src);
  $('irAt').innerHTML=IR_MAIN.map((s,k)=>`<option value="${k}"${k===R.at?' selected':''}>${hexA(MA(k))}  ${esc(irShort(s))}</option>`).join('');
  $('irAtWrap').hidden=R.src==='X';
  $('irSetupNote').textContent=t(R.src==='X'?'ir_note_x':'ir_note_irq');
}
function irInit(){
  irBuild();
  S.irq=Stepper(document.querySelector('[data-ctrl="irq"]'),()=>R.trace.length,irRender,1000);
  segInit($('irSrc'),v=>{R.src=v;irBuild();irFill();S.irq.reset();});
  $('irAt').addEventListener('change',e=>{R.at=+e.target.value;irBuild();S.irq.reset();});
}

/* =====================================================================
   DMA
   ===================================================================== */
const DN=32,DWORDS=8,DSRC=0x3FC80000,DDST=0x3FC80100;
const D={mode:'dma',checks:[]};
const dmSrcBytes=()=>{let s=t('dm_text');s=(s+'.'.repeat(DN)).slice(0,DN);return [...s].map(c=>c.charCodeAt(0));};
const dmLast=()=>D.mode==='dma'?11:10;
function dmInfo(step){
  const dma=D.mode==='dma';
  const copying=step>=2&&step<=9;
  const words=step<2?0:Math.min(DWORDS,step-1);
  const copied=words*4;
  let cpu,bus='free',dmaAct='idle',work=0;
  if(dma){
    work=500*Math.min(DWORDS,Math.max(0,step-1));
    if(step===0)cpu='idle';else if(step===1)cpu='setup';else if(copying)cpu='work';else if(step===10)cpu='isr';else cpu='after';
    if(step===1)bus='cfg';else if(copying){bus='dma';dmaAct='copy';}else if(step===10)bus='irq';
  }else{
    if(step===0)cpu='idle';else if(step<=9)cpu='copy';else cpu='ret';
    if(copying)bus='cpu';
  }
  return {dma,copying,words,copied,cpu,bus,dmaAct,work,done:dma&&step>=10,led:dma&&step>=10,cur:copying?words:0};
}
function dmRender(){
  const step=S.dma.i,I=dmInfo(step),src=dmSrcBytes();
  // explanation
  let e,badge='';
  if(step===0)e=t('dx0');
  else if(I.dma){
    if(step===1){e=t('dx_setup');badge=1;}
    else if(I.copying){e=t('dx_copy',I.words,I.copied);badge=2;}
    else if(step===10){e=t('dx_done');badge=3;}
    else e=t('dx_end',fmt(I.work));
  }else{
    if(step===1)e=t('dx_cset');else if(I.copying)e=t('dx_ccopy',I.words,I.copied);else e=t('dx_cend');
  }
  $('dmExpl').innerHTML=explHTML(e,badge);
  // CPU
  const doing={idle:'dd_idle',setup:'dd_setup',work:'dd_work',isr:'dd_isr',after:'dd_after',copy:'dd_copy',ret:'dd_ret'}[I.cpu];
  const reg=(k,v,c,raw)=>`<div class="reg${c?' chg':''}"><span>${raw?k:esc(t(k))}</span><b>${esc(v)}</b></div>`;
  const pv=step>0?dmInfo(step-1):I;
  $('dmCpu').innerHTML=reg('dm_doing',t(doing),false)+reg('<span class="mono">work</span>',fmt(I.work),I.work!==pv.work,1)+
    reg('<span class="mono">done</span>',I.dma?(I.done?t('dm_true'):t('dm_false')):'—',I.done!==pv.done,1)+reg('dm_led',I.led?t('dm_on'):t('dm_off'),I.led!==pv.led);
  const set=I.dma&&step>=1;
  $('dmRegs').innerHTML=reg('dm_src',set?hexA(DSRC):'—',I.dma&&step===1)+reg('dm_dst',set?hexA(DDST):'—',I.dma&&step===1)+
    reg('dm_len',set?'32':'—',I.dma&&step===1)+reg('dm_cnt',I.copied+' / 32',I.copying);
  $('dmProg').style.width=(I.copied/DN*100)+'%';
  const busTxt=I.bus==='free'?t('db_free'):I.bus==='cfg'?t('db_cfg'):I.bus==='irq'?t('db_irq'):I.bus==='dma'?t('db_dma',I.words,(I.words-1)*4):t('db_cpu',I.words,(I.words-1)*4);
  $('dmBus').innerHTML=`<span>${esc(t('dm_bus'))}</span><b style="font-size:14px;color:${I.bus==='dma'||I.bus==='cpu'?'var(--copy)':I.bus==='irq'?'var(--isr)':I.bus==='cfg'?'var(--poll)':'var(--muted)'}">${esc(busTxt)}</b>`;
  // memory
  const cell=(b,cl)=>`<div class="${cl}">${b?esc(String.fromCharCode(b)).replace(' ','␣'):'0'}</div>`;
  $('dmSrc').innerHTML=src.map((b,k)=>cell(b,I.copying&&Math.floor(k/4)===I.words-1?'now':'')).join('');
  $('dmDst').innerHTML=src.map((b,k)=>k<I.copied?cell(b,I.copying&&Math.floor(k/4)===I.words-1?'now':'full'):cell(0,'')).join('');
  $('dmSrcA').textContent=hexA(DSRC);$('dmDstA').textContent=hexA(DDST);
  // checks
  const CL=D.checks.slice(-5).reverse();
  $('dmChecks').innerHTML=CL.map((c,j)=>`<li class="${c.ok?'ok':'bad'}">${esc(t('dm_chk',c.s,c.ok?t('dm_ok'):t('dm_err'),c.k))}${!c.ok&&j===0?'<br>'+esc(t('dm_early')):''}</li>`).join('');
  dmCode(step,I);dmTimeline(step);
}
function dmCode(step,I){
  let L,act=[];
  if(I.dma){
    L=['static bool IRAM_ATTR onDone(...) {','  done = true;','  digitalWrite(LED, HIGH);','  return false;','}','','done = false;',
       'esp_async_memcpy(dma, dst, src, N, onDone, NULL);  // 1','while (!done) {','  work++;                                         // 2','}','lcd.print(work);'];
    if(step===1)act=[7];else if(I.copying)act=[8,9];else if(step===10)act=[0,1,2,3];else if(step===11)act=[11];
  }else{
    L=['uint32_t work = 0;','memcpy(dst, src, N);   // CPU','lcd.print(work);       // 0'];
    if(step>=1&&step<=9)act=[1];else if(step===10)act=[2];
  }
  const cls=I.copying?(I.dma?'w':'c'):step===10&&I.dma?'':'k';
  $('dmCode').innerHTML=L.map((s,k)=>`<span class="l${act.includes(k)?' act '+cls:''}">${codeHTML(s)||' '}</span>`).join('');
}
function dmTimeline(step){
  const last=dmLast(),X0=80,w=(1000-X0-10)/last;
  let o='';
  o+=txt(10,40,'CPU',{'font-size':13,'font-weight':600});o+=txt(10,86,'DMA',{'font-size':13,'font-weight':600});
  for(let s=1;s<=last;s++){
    const I=dmInfo(s),x=X0+(s-1)*w,op=s<=step?1:.2;
    const cc={setup:'var(--poll)',work:'var(--work)',isr:'var(--isr)',after:'var(--work)',copy:'var(--copy)',ret:'var(--work)'}[I.cpu];
    o+=svgEl('rect',{x:x+1,y:22,width:w-2,height:28,rx:3,fill:cc,opacity:op});
    o+=svgEl('rect',{x:x+1,y:68,width:w-2,height:28,rx:3,fill:I.dmaAct==='copy'?'var(--copy)':'var(--idle)',opacity:I.dmaAct==='copy'?op:op*.6});
    if(s===step){o+=svgEl('rect',{x:x-1,y:18,width:w+2,height:82,rx:5,fill:'none',stroke:'var(--ink)','stroke-width':2});}
  }
  o+=txt(X0,114,'t →',{'font-size':11.5,fill:'var(--muted)'});
  $('dmSvg').innerHTML=o;
  const it=(c,l)=>`<span><span class="sw" style="background:${c}"></span>${esc(l)}</span>`;
  $('dmLegend').innerHTML=(D.mode==='dma'?it('var(--poll)',t('dl_setup')):'')+it('var(--work)',t('lg_work'))+it('var(--copy)',t('lg_copy'))+(D.mode==='dma'?it('var(--isr)',t('dl_irq')):'')+it('var(--idle)',t('dl_idle'));
}
function dmInit(){
  S.dma=Stepper(document.querySelector('[data-ctrl="dma"]'),()=>dmLast()+1,dmRender,800);
  segInit($('dmMode'),v=>{D.mode=v;D.checks=[];segSync($('dmMode'),v);S.dma.reset();});
  $('dmCheck').addEventListener('click',()=>{const I=dmInfo(S.dma.i);D.checks.push({s:S.dma.i,ok:I.copied===DN,k:I.copied});dmRender();});
}

/* ---------- kalkulator / calculator ---------- */
const CA_PRE=[
  {k:'cp_kb',v:[1000,1000,20,1]},{k:'cp_ser',v:[1000,1000,100000,1]},{k:'cp_ssd',v:[1000,1000,100000000,1]},
  {k:'cp_dma',v:[1000,1000,100000000,4000]},{k:'cp_tim',v:[160,200,1000,1]}];
let caSel=2;
const caIds=['caMhz','caCyc','caRate','caPer'];
function caFill(){
  $('caPresets').innerHTML=CA_PRE.map((p,i)=>`<button data-i2="${i}" aria-pressed="${i===caSel}">${esc(t(p.k))}</button>`).join('');
  $('caPresets').querySelectorAll('button').forEach(b=>b.onclick=()=>{caSel=+b.dataset.i2;CA_PRE[caSel].v.forEach((v,k)=>$(caIds[k]).value=v);caFill();caCalc();});
}
function caNum(id){const v=$(id).value.trim().replace(/[\s_\u00A0\u202F]/g,'').replace(',','.');const n=Number(v);return v!==''&&isFinite(n)&&n>0?n:null;}
function caCalc(){
  const [mhz,cyc,rate,per]=caIds.map(caNum);
  if([mhz,cyc,rate,per].some(x=>x===null)){$('caErr').textContent=t('ca_err');return;}
  $('caErr').textContent='';
  const irq=rate/per,cps=irq*cyc,hz=mhz*1e6,pct=cps/hz*100;
  const st=(k,v,cl)=>`<div class="stat ${cl||''}"><span>${esc(t(k))}</span><b>${esc(v)}</b></div>`;
  $('caStats').innerHTML=st('cs_irq',fmt(Math.round(irq*1000)/1000))+st('cs_cyc',fmt(Math.round(cps)))+st('cs_pct',fmtP(pct),pct>100?'bad':pct<5?'good':'')+st('cs_left',fmtP(Math.max(0,100-pct)),pct>=100?'bad':'');
  const bar=$('caBar');bar.querySelector('i').style.width=Math.min(100,pct)+'%';
  bar.querySelector('span').textContent=t('ca_bar',fmtP(pct));
  $('caFormula').textContent=`${fmt(irq)} × ${fmt(cyc)} / ${fmt(hz)} × 100% = ${fmtP(pct)}`;
  $('caNote').textContent=pct>100?t('ca_over',fmt(Math.ceil(pct/100))):pct>=5?t('ca_mid'):t('ca_low');
}
function caInit(){
  CA_PRE[caSel].v.forEach((v,k)=>$(caIds[k]).value=v);
  caIds.forEach(id=>$(id).addEventListener('input',()=>{caSel=-1;caFill();caCalc();}));
}

const S={};
const MODS=['i2c','mmio','gpio','poll','irq','dma'];
let cur='i2c';
try{const h=location.hash.slice(1);if(MODS.includes(h))cur=h;else{const s=localStorage.getItem('ioSimMod');if(MODS.includes(s))cur=s;}}catch(e){}
function renderAll(){
  i2cFill();S.i2c.go(S.i2c.i);
  mmFill();S.mmio.go(S.mmio.i);
  gpFill();gpRender();
  poLegend();poRender();
  irFill();S.irq.go(S.irq.i);
  segSync($('dmMode'),D.mode);S.dma.go(S.dma.i);
  caFill();caCalc();
}
function applyLang(){
  document.documentElement.lang=lang;document.title=t('doc_title');
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i);});
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  renderAll();
}
function showMod(m){
  if(S[cur]&&S[cur].stop)S[cur].stop();
  if(cur==='poll'&&m!=='poll'){poUp();poPause();}
  cur=m;
  MODS.forEach(k=>{$('mod-'+k).hidden=k!==m;});
  document.querySelectorAll('#topics button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mod===m)));
  try{localStorage.setItem('ioSimMod',m);history.replaceState(null,'','#'+m);}catch(e){}
}
document.querySelectorAll('#topics button').forEach(b=>b.addEventListener('click',()=>showMod(b.dataset.mod)));
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>{
  lang=b.dataset.lang;try{localStorage.setItem('ioSimLang',lang);}catch(e){}GP.last=null;applyLang();
}));
const typing=e=>{const tg=e.target;return tg&&(tg.tagName==='INPUT'||tg.tagName==='SELECT'||tg.tagName==='TEXTAREA'||tg.isContentEditable);};
document.addEventListener('keydown',e=>{
  if(typing(e)||e.ctrlKey||e.metaKey||e.altKey)return;
  if(cur==='poll'){
    if(e.key===' '){e.preventDefault();if(!e.repeat)poDown();}
    return;
  }
  const s=S[cur];if(!s)return;
  if(e.key==='ArrowRight'){e.preventDefault();s.stop();s.next();}
  else if(e.key==='ArrowLeft'){e.preventDefault();s.prev();}
  else if(e.key===' '&&!(e.target&&e.target.tagName==='BUTTON')){e.preventDefault();s.toggle();}
});
document.addEventListener('keyup',e=>{if(cur==='poll'&&e.key===' '){e.preventDefault();poUp();}});
